<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 24 Custom HUD - Studio Preview & Test Harness</title>
  <!-- Google Fonts: Rajdhani & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700;800;900&family=Rajdhani:wght@600;700;800;900&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', system-ui, sans-serif;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Background presets */
    .bg-cockpit {
      background-image: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, rgba(2, 6, 23, 0.95) 100%), url('/static/cockpit.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .bg-carbon {
      background-color: #0B0F17;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
      background-size: 20px 20px;
    }

    .bg-checker {
      background-color: #121620;
      background-image:
        linear-gradient(45deg, #182030 25%, transparent 25%),
        linear-gradient(-45deg, #182030 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #182030 75%),
        linear-gradient(-45deg, transparent 75%, #182030 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    }

    input[type=range] {
      accent-color: #00E5FF;
    }
  </style>
</head>

<body class="w-screen h-screen m-0 p-0 overflow-hidden select-none text-white bg-cockpit transition-all duration-300" id="mainBody">

  <!-- TOP BAR: Control Studio & Live Status -->
  <header class="absolute top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-3 bg-black/80 backdrop-blur-md border-b border-white/10 font-mono text-xs">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <i data-lucide="gauge" class="w-5 h-5 text-red-500"></i>
        <span class="font-extrabold tracking-wider text-base font-['Rajdhani']">F1 24 CUSTOM HUD</span>
        <span class="text-[10px] uppercase bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded font-bold">Studio Preview</span>
      </div>

      <!-- Telemetry Status Indicator -->
      <div class="flex items-center gap-2 ml-4 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs">
        <span id="statusIndicator" class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span id="statusText" class="text-gray-300">Conectando WebSocket...</span>
      </div>
    </div>

    <!-- Toolbar controls -->
    <div class="flex items-center gap-3">
      <!-- Background Mode Selector -->
      <div class="flex items-center gap-1 bg-white/5 p-1 rounded-lg border border-white/10">
        <span class="text-gray-400 px-2 text-[11px]">Cenário:</span>
        <button onclick="setBg('cockpit')" id="btnBgCockpit" class="px-2.5 py-1 rounded bg-red-600 text-white font-bold transition">🏎️ Cockpit</button>
        <button onclick="setBg('carbon')" id="btnBgCarbon" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">⬛ Carbon</button>
        <button onclick="setBg('checker')" id="btnBgChecker" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">🏁 Grade</button>
      </div>

      <!-- Mode Toggle: Live vs Test Harness -->
      <div class="flex items-center gap-1 bg-white/5 p-1 rounded-lg border border-white/10">
        <button onclick="setMode('live')" id="btnModeLive" class="px-3 py-1 rounded bg-emerald-500 text-black font-bold flex items-center gap-1.5 transition">
          <i data-lucide="radio" class="w-3.5 h-3.5"></i> Live 60Hz
        </button>
        <button onclick="setMode('harness')" id="btnModeHarness" class="px-3 py-1 rounded text-gray-400 hover:text-white flex items-center gap-1.5 transition">
          <i data-lucide="sliders" class="w-3.5 h-3.5"></i> [H] Test Harness
        </button>
      </div>

      <!-- Auto Cycle Quick Button -->
      <button id="btnTopStressLoop" onclick="toggleStressLoop()"
        class="px-3 py-1.5 rounded-lg bg-cyan-600/30 hover:bg-cyan-600/50 border border-cyan-400/40 text-cyan-300 hover:text-white font-bold flex items-center gap-1.5 transition">
        <i data-lucide="play-circle" class="w-4 h-4"></i>
        <span id="topStressText">Stress Loop</span>
      </button>
    </div>
  </header>

  <!-- TELEMETRY TEST HARNESS (SIDE DRAWER / SANDBOX) -->
  <aside id="harnessPanel"
    class="hidden absolute top-16 right-6 z-40 w-80 p-5 rounded-2xl bg-slate-900/95 backdrop-blur-xl border border-cyan-500/30 shadow-2xl flex flex-col gap-3 font-mono text-xs">
    <div class="flex items-center justify-between border-b border-white/10 pb-2">
      <span class="font-bold text-sm font-['Rajdhani'] uppercase tracking-wider text-cyan-300 flex items-center gap-2">
        <i data-lucide="sliders" class="w-4 h-4"></i> Telemetry Test Harness
      </span>
      <button onclick="setMode('live')" class="text-gray-400 hover:text-white text-base font-bold">&times;</button>
    </div>

    <!-- Sliders and manual controls -->
    <div class="flex flex-col gap-2.5">
      <!-- Speed -->
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-gray-300">
          <span>Velocidade (KM/H):</span>
          <span id="harnessSpeedVal" class="text-cyan-400 font-bold tabular-nums">295</span>
        </div>
        <input type="range" id="hSpeed" min="0" max="360" value="295" oninput="onHarnessChange()" class="cursor-pointer">
      </div>

      <!-- Gear Selector -->
      <div class="flex flex-col gap-1">
        <span class="text-gray-300">Marcha Engatada:</span>
        <div class="grid grid-cols-10 gap-1 text-[10px] text-center font-bold" id="harnessGearButtons">
          <button onclick="setHarnessGear(-1)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="-1">R</button>
          <button onclick="setHarnessGear(0)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="0">N</button>
          <button onclick="setHarnessGear(1)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="1">1</button>
          <button onclick="setHarnessGear(2)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="2">2</button>
          <button onclick="setHarnessGear(3)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="3">3</button>
          <button onclick="setHarnessGear(4)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="4">4</button>
          <button onclick="setHarnessGear(5)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="5">5</button>
          <button onclick="setHarnessGear(6)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="6">6</button>
          <button onclick="setHarnessGear(7)" class="h-gear-btn p-1 rounded bg-cyan-500 text-black border border-cyan-400 font-black" data-gear="7">7</button>
          <button onclick="setHarnessGear(8)" class="h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20" data-gear="8">8</button>
        </div>
      </div>

      <!-- RPM -->
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-gray-300">
          <span>RPM Motor:</span>
          <span id="harnessRpmVal" class="text-yellow-400 font-bold tabular-nums">11800</span>
        </div>
        <input type="range" id="hRpm" min="0" max="15000" value="11800" oninput="onHarnessChange()" class="accent-yellow-400 cursor-pointer">
      </div>

      <!-- Throttle & Brake -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1">
          <div class="flex justify-between text-gray-300">
            <span class="text-green-400">Throttle:</span>
            <span id="harnessThrVal" class="tabular-nums">100%</span>
          </div>
          <input type="range" id="hThrottle" min="0" max="100" value="100" oninput="onHarnessChange()" class="accent-green-400 cursor-pointer">
        </div>
        <div class="flex flex-col gap-1">
          <div class="flex justify-between text-gray-300">
            <span class="text-red-400">Brake:</span>
            <span id="harnessBrkVal" class="tabular-nums">0%</span>
          </div>
          <input type="range" id="hBrake" min="0" max="100" value="0" oninput="onHarnessChange()" class="accent-red-400 cursor-pointer">
        </div>
      </div>

      <!-- ERS Battery -->
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-gray-300">
          <span class="text-cyan-300">ERS Battery:</span>
          <span id="harnessErsVal" class="tabular-nums">85%</span>
        </div>
        <input type="range" id="hErs" min="0" max="100" value="85" oninput="onHarnessChange()" class="accent-cyan-400 cursor-pointer">
      </div>

      <!-- Overtake Toggle -->
      <label class="flex items-center justify-between cursor-pointer pt-2 border-t border-white/10">
        <span class="text-rose-400 font-bold">Overtake Mode</span>
        <input type="checkbox" id="hOvertake" onchange="onHarnessChange()" class="accent-rose-500 w-4 h-4 cursor-pointer">
      </label>
    </div>

    <!-- Stress Loop Action -->
    <div class="pt-2 border-t border-white/10 flex flex-col gap-1.5">
      <button id="btnStressLoop" onclick="toggleStressLoop()"
        class="w-full py-2 rounded-lg font-bold text-xs bg-cyan-600 hover:bg-cyan-500 text-white flex items-center justify-center gap-2 transition active:scale-95 shadow-lg shadow-cyan-600/30">
        <i data-lucide="play-circle" class="w-4 h-4"></i>
        <span id="stressLoopText">Iniciar Stress Loop (60 FPS)</span>
      </button>
      <span class="text-[10px] text-gray-400 text-center">Simula volta rápida com marchas, aceleração e frenagem extrema</span>
    </div>
  </aside>

  <!-- MAIN HUD CONTAINER (POSITIONED OVER COCKPIT HALO) -->
  <main class="w-screen h-screen m-0 p-0 pointer-events-none flex flex-col justify-end items-center pb-12 relative" id="hudContainer">
    
    <div id="hud-container" class="relative w-full max-w-[960px] mx-auto select-none font-['Rajdhani'] pointer-events-auto">
      <svg viewBox="0 0 960 210" class="w-full h-auto drop-shadow-[0_10px_22px_rgba(0,0,0,0.75)] filter">
        <defs>
          <!-- ERS Battery Gradient -->
          <linearGradient id="ersGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#0077B6" />
          </linearGradient>

          <!-- Tachometer RPM Gradient -->
          <linearGradient id="rpmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00FF66" />
            <stop offset="68%" stop-color="#FFDD00" />
            <stop offset="92%" stop-color="#FF0055" />
          </linearGradient>

          <!-- Master Halo Chassis Gradient -->
          <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(14, 24, 42, 0.88)" />
            <stop offset="50%" stop-color="rgba(8, 14, 26, 0.95)" />
            <stop offset="100%" stop-color="rgba(14, 24, 42, 0.88)" />
          </linearGradient>

          <!-- Center Pod Radial Depth -->
          <radialGradient id="podRadial" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(20, 36, 60, 0.90)" />
            <stop offset="85%" stop-color="rgba(6, 12, 22, 0.96)" />
          </radialGradient>

          <!-- Accent Glow -->
          <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- 1. MASTER CONTINUOUS CURVED HALO CHASSIS -->
        <path d="
          M 115,75
          L 385,52
          Q 430,22 480,22
          Q 530,22 575,52
          L 845,75
          Q 860,82 860,98
          L 860,154
          Q 860,170 845,178
          L 575,168
          Q 530,196 480,196
          Q 430,196 385,168
          L 115,178
          Q 100,170 100,154
          L 100,98
          Q 100,82 115,75
          Z
        " fill="url(#chassisGrad)" stroke="rgba(0, 229, 255, 0.40)" stroke-width="1.5" />

        <!-- Aero Accents on Halo Wings -->
        <path d="M 120,79 L 380,56" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <path d="M 580,56 L 840,79" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

        <!-- 2. ASA ESQUERDA: ERS BATTERY & BRAKE -->
        <text x="135" y="88" fill="#94A3B8" font-size="11" font-weight="800" letter-spacing="1.2">ERS BATTERY</text>
        <text id="ers-percent" x="365" y="88" text-anchor="end" fill="#FFFFFF" font-size="19" font-weight="900" font-family="'JetBrains Mono'" class="tabular-nums">85%</text>
        
        <!-- ERS Progress Bar -->
        <rect x="135" y="96" width="230" height="9" rx="2.5" fill="rgba(255,255,255,0.08)" />
        <rect id="ers-bar" x="135" y="96" width="195" height="9" rx="2.5" fill="url(#ersGradient)" />
        
        <!-- Brake Bar -->
        <text x="135" y="124" fill="#EF4444" font-size="11" font-weight="800" letter-spacing="1">BRAKE</text>
        <rect x="190" y="116" width="175" height="8" rx="2" fill="rgba(255,255,255,0.08)" />
        <rect id="brake-bar" x="190" y="116" width="0" height="8" rx="2" fill="#EF4444" />

        <!-- DRS Status Badge -->
        <g id="drs-badge">
          <rect id="drs-box" x="135" y="136" width="60" height="16" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
          <text id="drs-text" x="165" y="148" text-anchor="middle" fill="#94A3B8" font-size="8.5" font-weight="800" font-family="'JetBrains Mono'">DRS</text>
        </g>
        <text x="365" y="148" text-anchor="end" fill="rgba(255,255,255,0.25)" font-size="8" font-weight="700" letter-spacing="1.5">F1 BROADCAST</text>

        <!-- 3. DOMO CENTRAL: VELOCÍMETRO DUPLO COM TACÔMETRO ARREDONDADO -->
        <circle cx="480" cy="105" r="52" fill="url(#podRadial)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
        
        <!-- Speed Progress Arc (r=48, circumference=301.59) -->
        <circle cx="480" cy="105" r="48" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5" />
        <circle id="speed-arc" cx="480" cy="105" r="48" fill="none" stroke="#00E5FF" stroke-width="4.5"
          stroke-dasharray="301.59" stroke-dashoffset="54.2" stroke-linecap="round"
          transform="rotate(-90 480 105)" filter="url(#accentGlow)" />
        
        <!-- Speed Readouts -->
        <text x="480" y="73" text-anchor="middle" fill="#94A3B8" font-size="9" font-weight="800" letter-spacing="1">KM/H</text>
        <text id="speed-kmh" x="480" y="108" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="900" font-family="'JetBrains Mono'" class="tabular-nums">295</text>
        <line x1="455" y1="114" x2="505" y2="114" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
        <text id="speed-mph" x="480" y="130" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700" font-family="'JetBrains Mono'" class="tabular-nums">183</text>
        <text x="480" y="141" text-anchor="middle" fill="#64748B" font-size="8" font-weight="800" letter-spacing="0.5">MPH</text>
        <text id="gear-center" x="480" y="161" text-anchor="middle" fill="#00E5FF" font-size="14" font-weight="900" font-family="'JetBrains Mono'">7</text>

        <!-- 4. CONTEÚDO ASA DIREITA (100% CONTIDO NO CORPO) -->
        <!-- Acelerador (Throttle) -->
        <text x="645" y="88" fill="#10B981" font-size="10" font-weight="900" letter-spacing="1">THROTTLE</text>
        <rect x="715" y="81" width="135" height="8" rx="2" fill="rgba(255, 255, 255, 0.08)" />
        <rect id="throttle-bar" x="715" y="81" width="100" height="8" rx="2" fill="#10B981" />

        <!-- Rótulo e Linha de Marchas -->
        <text x="645" y="105" fill="#94A3B8" font-size="9" font-weight="800" letter-spacing="1">GEARS</text>
        <g id="gears-row" font-family="'Chakra Petch', 'JetBrains Mono'" font-size="12.5" font-weight="700" fill="#64748B" dominant-baseline="central">
          <text x="626" y="120" id="gear-R">R</text>
          <text x="650" y="120" id="gear-N">N</text>
          <text x="674" y="120" id="gear-1">1</text>
          <text x="698" y="120" id="gear-2">2</text>
          <text x="722" y="120" id="gear-3">3</text>
          <text x="746" y="120" id="gear-4">4</text>
          <text x="770" y="120" id="gear-5">5</text>
          <text x="794" y="120" id="gear-6">6</text>
          <text x="818" y="120" id="gear-7" fill="#00F5D4" font-size="17" font-weight="900">7</text>
          <text x="842" y="120" id="gear-8">8</text>
        </g>

        <!-- Cabeçalho RPM e Badge OVERTAKE Integrado Lado a Lado -->
        <text x="645" y="138" fill="#94A3B8" font-size="9" font-weight="700" letter-spacing="0.5">RPM x1000</text>

        <!-- Badge OVERTAKE interno (alinhado à direita antes da barra) -->
        <g id="overtake-badge" class="transition-opacity duration-150 opacity-0">
          <rect x="780" y="129" width="70" height="14" rx="2" fill="#E11D48" />
          <text x="815" y="136" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="8" font-weight="900" letter-spacing="1">OVERTAKE</text>
        </g>

        <!-- Tacômetro RPM (Dentro da asa, margem inferior segura) -->
        <rect x="645" y="146" width="205" height="10" rx="3" fill="rgba(255, 255, 255, 0.08)" />
        <rect id="rpm-bar" x="645" y="146" width="150" height="10" rx="3" fill="url(#rpmGradient)" />
      </svg>
    </div>

  </main>

  <script>
    lucide.createIcons();

    // Direct DOM nodes for 60Hz loop
    const speedKmhEl = document.getElementById('speed-kmh');
    const speedMphEl = document.getElementById('speed-mph');
    const speedArcEl = document.getElementById('speed-arc');
    const ersPercentEl = document.getElementById('ers-percent');
    const ersBarEl = document.getElementById('ers-bar');
    const brakeBarEl = document.getElementById('brake-bar');
    const throttleBarEl = document.getElementById('throttle-bar');
    const rpmBarEl = document.getElementById('rpm-bar');
    const rpmNumEl = document.getElementById('rpm-num');
    const gearCenterEl = document.getElementById('gear-center');
    const overtakeBadgeEl = document.getElementById('overtake-badge');
    const drsBoxEl = document.getElementById('drs-box');
    const drsTextEl = document.getElementById('drs-text');
    const statusTextEl = document.getElementById('statusText');
    const statusIndicatorEl = document.getElementById('statusIndicator');

    // Gear references
    const gearList = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];
    const gearEls = {};
    gearList.forEach(g => {
      gearEls[g] = document.getElementById(`gear-${g}`);
    });

    const SPEED_CIRCUMFERENCE = 301.59; // 2 * Math.PI * 48
    let currentGear = '7';
    let currentMode = 'live';
    let isStressLoopActive = false;
    let stressReqId = null;

    // DIRECT HIGH-PERFORMANCE RENDERER
    function applyTelemetryDirect(t) {
      // 1. Speed (KM/H & MPH)
      const kmh = Math.round(Number(t.speed) || 0);
      const mph = Math.round(kmh * 0.621371);
      speedKmhEl.textContent = kmh;
      speedMphEl.textContent = mph;

      // Arc progress (0 to 360 km/h)
      const spdRatio = Math.min(1, Math.max(0, kmh / 360));
      const dashOffset = SPEED_CIRCUMFERENCE * (1 - spdRatio);
      speedArcEl.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));

      // 2. ERS Battery (0 to 100%)
      let ersPct = 100;
      if (t.ersPercent !== undefined) ersPct = Number(t.ersPercent);
      else if (t.ers_store !== undefined) ersPct = Number(t.ers_store);
      else if (t.ersStoreEnergy !== undefined) ersPct = (Number(t.ersStoreEnergy) / 4000000) * 100;
      ersPct = Math.max(0, Math.min(100, ersPct));
      
      ersPercentEl.textContent = `${Math.round(ersPct)}%`;
      ersBarEl.setAttribute('width', (ersPct * 2.3).toFixed(1)); // 230px max

      // 3. Brake (0 to 100%)
      let brkPct = Number(t.brake) || 0;
      if (brkPct > 0 && brkPct <= 1.0) brkPct *= 100;
      brkPct = Math.max(0, Math.min(100, brkPct));
      brakeBarEl.setAttribute('width', (brkPct * 1.75).toFixed(1)); // 175px max

      // 4. Throttle (0 to 100%)
      let thrPct = Number(t.throttle) || 0;
      if (thrPct > 0 && thrPct <= 1.0) thrPct *= 100;
      thrPct = Math.max(0, Math.min(100, thrPct));
      throttleBarEl.setAttribute('width', (thrPct * 1.35).toFixed(1)); // 135px max

      // 5. Gear
      const gRaw = t.gear !== undefined ? t.gear : 0;
      let activeGearStr = 'N';
      if (gRaw === -1 || gRaw === '-1' || gRaw === 'R' || gRaw === 'r') activeGearStr = 'R';
      else if (gRaw >= 1 && gRaw <= 8) activeGearStr = String(gRaw);
      else activeGearStr = 'N';

      if (currentGear !== activeGearStr) {
        currentGear = activeGearStr;
        gearCenterEl.textContent = activeGearStr;
        gearCenterEl.setAttribute('fill', activeGearStr === 'R' ? '#EF4444' : '#00F5D4');

        gearList.forEach(g => {
          const el = gearEls[g];
          if (!el) return;
          if (g === activeGearStr) {
            el.setAttribute('fill', g === 'R' ? '#EF4444' : '#00F5D4');
            el.setAttribute('font-size', '16');
            el.setAttribute('font-weight', '900');
          } else {
            el.setAttribute('fill', '#64748B');
            el.setAttribute('font-size', '13');
            el.setAttribute('font-weight', '700');
          }
        });
      }

      // 6. RPM (0 to 15000)
      const rpm = Number(t.engineRPM !== undefined ? t.engineRPM : (t.engine_rpm || 0));
      const rpmRatio = Math.max(0, Math.min(1, rpm / 15000));
      rpmBarEl.setAttribute('width', (rpmRatio * 205).toFixed(1)); // 205px max
      if (rpmNumEl) rpmNumEl.textContent = Math.round(rpm);

      // 7. Overtake / DRS
      const isOvertake = Boolean(t.overtake || t.ersDeploy);
      overtakeBadgeEl.setAttribute('opacity', isOvertake ? '1' : '0');

      const drsState = t.drs === 1 ? 2 : (t.drsAllowed === 1 ? 1 : 0);
      if (drsBoxEl && drsTextEl) {
        if (drsState === 2) {
          drsBoxEl.setAttribute('fill', '#00E676');
          drsBoxEl.setAttribute('stroke', '#00E676');
          drsTextEl.setAttribute('fill', '#000000');
          drsTextEl.textContent = 'DRS OPEN';
        } else if (drsState === 1) {
          drsBoxEl.setAttribute('fill', 'rgba(0, 229, 255, 0.2)');
          drsBoxEl.setAttribute('stroke', '#00E5FF');
          drsTextEl.setAttribute('fill', '#00E5FF');
          drsTextEl.textContent = 'DRS';
        } else {
          drsBoxEl.setAttribute('fill', 'rgba(255, 255, 255, 0.06)');
          drsBoxEl.setAttribute('stroke', 'rgba(255, 255, 255, 0.12)');
          drsTextEl.setAttribute('fill', '#94A3B8');
          drsTextEl.textContent = 'DRS';
        }
      }
    }

    // WEBSOCKET TELEMETRY
    let ws = null;
    function connectWs() {
      const loc = window.location;
      const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = loc.hostname || '127.0.0.1';
      const wsPort = loc.port || '8000';
      const wsUrl = `${wsProto}//${wsHost}:${wsPort}/ws/telemetry`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        if (currentMode === 'live') {
          statusIndicatorEl.className = 'w-2 h-2 rounded-full bg-emerald-400';
          statusTextEl.textContent = 'F1 24 Conectado (60Hz)';
        }
      };

      ws.onmessage = (evt) => {
        if (currentMode !== 'live') return;
        try {
          const raw = JSON.parse(evt.data);
          const data = (raw.type === 'telemetry' && raw.data) ? raw.data : raw;
          if (data && (data.speed !== undefined || data.engineRPM !== undefined || data.engine_rpm !== undefined)) {
            applyTelemetryDirect(data);
          }
        } catch (e) { }
      };

      ws.onclose = () => {
        if (currentMode === 'live') {
          statusIndicatorEl.className = 'w-2 h-2 rounded-full bg-yellow-400 animate-pulse';
          statusTextEl.textContent = 'Aguardando F1 24 (UDP 20777)...';
        }
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch (e) { }
      };
    }

    // MODE SELECTION: LIVE VS HARNESS
    function setMode(mode) {
      currentMode = mode;
      const btnLive = document.getElementById('btnModeLive');
      const btnHarness = document.getElementById('btnModeHarness');
      const panel = document.getElementById('harnessPanel');

      if (mode === 'live') {
        stopStressLoop();
        btnLive.className = 'px-3 py-1 rounded bg-emerald-500 text-black font-bold flex items-center gap-1.5 transition';
        btnHarness.className = 'px-3 py-1 rounded text-gray-400 hover:text-white flex items-center gap-1.5 transition';
        panel.classList.add('hidden');
        statusIndicatorEl.className = (ws && ws.readyState === WebSocket.OPEN) ? 'w-2 h-2 rounded-full bg-emerald-400' : 'w-2 h-2 rounded-full bg-yellow-400 animate-pulse';
        statusTextEl.textContent = (ws && ws.readyState === WebSocket.OPEN) ? 'F1 24 Conectado (60Hz)' : 'Aguardando F1 24...';
      } else {
        btnLive.className = 'px-3 py-1 rounded text-gray-400 hover:text-white flex items-center gap-1.5 transition';
        btnHarness.className = 'px-3 py-1 rounded bg-cyan-500 text-black font-bold flex items-center gap-1.5 transition';
        panel.classList.remove('hidden');
        statusIndicatorEl.className = 'w-2 h-2 rounded-full bg-amber-400';
        statusTextEl.textContent = 'Harness Ativo (Manual)';
        onHarnessChange();
      }
    }

    // TEST HARNESS CONTROLS
    let harnessSelectedGear = 7;
    function setHarnessGear(g) {
      harnessSelectedGear = g;
      document.querySelectorAll('.h-gear-btn').forEach(btn => {
        const val = Number(btn.getAttribute('data-gear'));
        if (val === g) {
          btn.className = 'h-gear-btn p-1 rounded bg-cyan-500 text-black border border-cyan-400 font-black';
        } else {
          btn.className = 'h-gear-btn p-1 rounded bg-white/5 border border-white/10 hover:bg-white/20 text-gray-300';
        }
      });
      onHarnessChange();
    }

    function onHarnessChange() {
      if (currentMode !== 'harness') return;
      const spd = Number(document.getElementById('hSpeed').value);
      const rpm = Number(document.getElementById('hRpm').value);
      const thr = Number(document.getElementById('hThrottle').value);
      const brk = Number(document.getElementById('hBrake').value);
      const ers = Number(document.getElementById('hErs').value);
      const ovt = Boolean(document.getElementById('hOvertake').checked);

      document.getElementById('harnessSpeedVal').textContent = `${spd} km/h`;
      document.getElementById('harnessRpmVal').textContent = rpm;
      document.getElementById('harnessThrVal').textContent = `${thr}%`;
      document.getElementById('harnessBrkVal').textContent = `${brk}%`;
      document.getElementById('harnessErsVal').textContent = `${ers}%`;

      applyTelemetryDirect({
        speed: spd,
        gear: harnessSelectedGear,
        engineRPM: rpm,
        throttle: thr,
        brake: brk,
        ersPercent: ers,
        overtake: ovt
      });
    }

    // STRESS LOOP
    let stressState = 'accel';
    let stressGear = 1;
    let stressSpeed = 35;
    let stressRpm = 4500;
    let stressThr = 100;
    let stressBrk = 0;
    let stressOvt = false;

    function toggleStressLoop() {
      if (isStressLoopActive) stopStressLoop();
      else startStressLoop();
    }

    function startStressLoop() {
      if (currentMode !== 'harness') setMode('harness');
      isStressLoopActive = true;
      stressState = 'accel';
      stressGear = 1;
      stressSpeed = 40;
      stressRpm = 5000;
      stressThr = 100;
      stressBrk = 0;

      const btn = document.getElementById('btnStressLoop');
      const text = document.getElementById('stressLoopText');
      const topBtn = document.getElementById('btnTopStressLoop');
      const topText = document.getElementById('topStressText');

      if (btn) btn.className = 'w-full py-2 rounded-lg font-bold text-xs bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center gap-2 transition active:scale-95 shadow-lg shadow-emerald-600/30';
      if (text) text.textContent = 'Parar Stress Loop';
      if (topBtn) topBtn.className = 'px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold flex items-center gap-1.5 transition';
      if (topText) topText.textContent = 'Parar Loop';

      runStressFrame();
    }

    function stopStressLoop() {
      isStressLoopActive = false;
      if (stressReqId) {
        cancelAnimationFrame(stressReqId);
        stressReqId = null;
      }
      const btn = document.getElementById('btnStressLoop');
      const text = document.getElementById('stressLoopText');
      const topBtn = document.getElementById('btnTopStressLoop');
      const topText = document.getElementById('topStressText');

      if (btn) btn.className = 'w-full py-2 rounded-lg font-bold text-xs bg-cyan-600 hover:bg-cyan-500 text-white flex items-center justify-center gap-2 transition active:scale-95 shadow-lg shadow-cyan-600/30';
      if (text) text.textContent = 'Iniciar Stress Loop (60 FPS)';
      if (topBtn) topBtn.className = 'px-3 py-1.5 rounded-lg bg-cyan-600/30 hover:bg-cyan-600/50 border border-cyan-400/40 text-cyan-300 hover:text-white font-bold flex items-center gap-1.5 transition';
      if (topText) topText.textContent = 'Stress Loop';
    }

    const GEAR_SPEED_RATIOS = { 1: 0.0072, 2: 0.0105, 3: 0.0138, 4: 0.0172, 5: 0.0205, 6: 0.0232, 7: 0.0252, 8: 0.0268 };

    function runStressFrame() {
      if (!isStressLoopActive) return;

      if (stressState === 'accel') {
        stressThr = 100;
        stressBrk = 0;
        stressRpm += 135;
        if (stressGear >= 6) stressOvt = true;

        if (stressRpm >= 13400) {
          if (stressGear < 8) {
            stressGear++;
            stressRpm = 9400;
          } else {
            stressState = 'braking';
            stressOvt = false;
          }
        }
      } else if (stressState === 'braking') {
        stressThr = 0;
        stressBrk = 100;
        stressOvt = false;
        stressRpm -= 240;

        if (stressRpm <= 8800) {
          if (stressGear > 2) {
            stressGear--;
            stressRpm = 11800;
          } else {
            stressState = 'accel';
            stressGear = 2;
            stressRpm = 6800;
          }
        }
      }

      const ratio = GEAR_SPEED_RATIOS[stressGear] || 0.02;
      stressSpeed = Math.min(355, Math.max(0, Math.round(stressRpm * ratio)));

      document.getElementById('hSpeed').value = stressSpeed;
      document.getElementById('hRpm').value = Math.round(stressRpm);
      document.getElementById('hThrottle').value = stressThr;
      document.getElementById('hBrake').value = stressBrk;
      document.getElementById('hOvertake').checked = stressOvt;
      harnessSelectedGear = stressGear;

      onHarnessChange();
      stressReqId = requestAnimationFrame(runStressFrame);
    }

    // HOTKEY 'H' LISTENER
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        setMode(currentMode === 'live' ? 'harness' : 'live');
      }
    });

    // SCENARIO BACKGROUND TOGGLE
    function setBg(preset) {
      const b = document.getElementById('mainBody');
      const bC = document.getElementById('btnBgCockpit');
      const bK = document.getElementById('btnBgCarbon');
      const bG = document.getElementById('btnBgChecker');

      b.classList.remove('bg-cockpit', 'bg-carbon', 'bg-checker');
      [bC, bK, bG].forEach(btn => btn.className = 'px-2.5 py-1 rounded text-gray-400 hover:text-white transition');

      if (preset === 'cockpit') {
        b.classList.add('bg-cockpit');
        bC.className = 'px-2.5 py-1 rounded bg-red-600 text-white font-bold transition';
      } else if (preset === 'carbon') {
        b.classList.add('bg-carbon');
        bK.className = 'px-2.5 py-1 rounded bg-red-600 text-white font-bold transition';
      } else {
        b.classList.add('bg-checker');
        bG.className = 'px-2.5 py-1 rounded bg-red-600 text-white font-bold transition';
      }
    }

    // INITIAL LOAD
    connectWs();
    applyTelemetryDirect({
      speed: 295,
      gear: 7,
      engineRPM: 11800,
      throttle: 100,
      brake: 0,
      ersPercent: 85,
      overtake: false
    });
  </script>
</body>

</html>
