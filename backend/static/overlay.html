<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 24 Live Halo HUD Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700;1,800&family=Titillium+Web:ital,wght@0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/halo.css">
  <link rel="stylesheet" href="halo.css">
</head>
<body>
<main id="hudRoot">
  <div id="haloHud">
    <!-- ASA ESQUERDA: PILOTOS + DELTA + ERS -->
    <div id="leftWing" class="halo-wing wing-left">
      <div class="wing-content">
        <!-- Piloto 1 (11 SAINZ) -->
        <div class="driver-row">
          <div class="driver-info">
            <span class="team-badge ferrari">■</span>
            <span class="driver-num">11</span>
            <span class="driver-name">SAINZ</span>
          </div>
          <div class="delta-tag">
            <span class="delta-val">+0.241s</span>
            <span class="delta-arrow">▶</span>
          </div>
        </div>

        <div class="wing-divider"></div>

        <!-- Piloto 2 (12 RUSSELL) -->
        <div class="driver-row">
          <div class="driver-info">
            <span class="team-badge merc">●</span>
            <span class="driver-num">12</span>
            <span class="driver-name">RUSSELL</span>
          </div>
          <div class="delta-tag live">
            <span id="deltaText" class="delta-val live">+0.241s</span>
            <span class="delta-arrow">▶</span>
          </div>
        </div>

        <!-- Bateria ERS -->
        <div class="ers-row">
          <span class="ers-label">ERS</span>
          <div class="ers-track">
            <div id="ersBar" class="ers-fill" style="width: 78%;"></div>
          </div>
          <span id="ersPctText" class="ers-pct">78%</span>
        </div>
      </div>
    </div>

    <!-- POD CENTRAL: TACÔMETRO + VELOCIDADE + DRS -->
    <div id="centerPod" class="halo-center-pod">
      <!-- Pílula DRS Encaixada no Topo -->
      <div id="drsBadge" class="drs-pill ready">
        <span id="drsText" class="drs-text">DRS</span>
      </div>

      <!-- Dial Circular -->
      <div class="speed-dial">
        <!-- Arco de LEDs de RPM -->
        <svg class="rpm-svg" viewBox="0 0 180 180">
          <g id="rpmSegments" transform="translate(90 90)"></g>
        </svg>

        <div class="speed-display">
          <span class="rpm-title">RPM</span>
          <span id="speedVal" class="speed-val">264</span>
          <span class="unit-title">KM/H</span>
        </div>
      </div>
    </div>

    <!-- ASA DIREITA: THROTTLE + BRAKE + MARCHAS -->
    <div id="rightWing" class="halo-wing wing-right">
      <div class="wing-content">
        <!-- Throttle Bar -->
        <div class="pedal-row">
          <div class="pedal-track">
            <div id="throttleBar" class="pedal-fill throttle" style="width: 100%;"></div>
          </div>
          <div class="pedal-info">
            <span id="throttlePctVal" class="pedal-pct">100%</span>
            <span class="pedal-label throttle">THROTTLE</span>
          </div>
        </div>

        <!-- Brake Bar -->
        <div class="pedal-row brake-row">
          <div class="pedal-track brake-track">
            <div id="brakeBar" class="pedal-fill brake" style="width: 0%;"></div>
          </div>
          <div class="pedal-info">
            <span class="pedal-label brake">BRAKE</span>
          </div>
        </div>

        <!-- Régua de Marchas (N 1 2 3 4 5 6 7 8) -->
        <div id="gearStrip" class="gear-strip">
          <span id="g_R" class="gear-cell">R</span>
          <span id="g_N" class="gear-cell">N</span>
          <span id="g_1" class="gear-cell">1</span>
          <span id="g_2" class="gear-cell">2</span>
          <span id="g_3" class="gear-cell">3</span>
          <span id="g_4" class="gear-cell">4</span>
          <span id="g_5" class="gear-cell">5</span>
          <span id="g_6" class="gear-cell active">6</span>
          <span id="g_7" class="gear-cell">7</span>
          <span id="g_8" class="gear-cell">8</span>
        </div>
      </div>
    </div>
  </div>

  <nav id="controls" class="pywebview-drag-region" aria-label="Controles da HUD">
    <span>F1 24 OFFICIAL HALO HUD</span>
    <button id="lockButton">Travar · F8</button>
    <button id="centerButton">Centralizar</button>
    <button id="closeButton" aria-label="Fechar HUD">×</button>
  </nav>

  <div id="connection" role="status">CONECTANDO AO BACKEND</div>
</main>
<script type="module" src="/static/halo.js"></script>
<script type="module" src="halo.js"></script>
</body>
</html>
