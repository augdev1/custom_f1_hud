<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 24 Live HUD Overlay</title><link rel="stylesheet" href="halo.css"><link rel="stylesheet" href="/static/halo.css"></head>
<body><main id="hudRoot">
<svg id="halo" viewBox="-45 -10 1090 250" role="img" aria-label="Telemetria: velocidade, marcha, ERS, freio, acelerador e DRS">
<!-- Segments share a single continuous halo curve. No rectangular card chassis. -->
<path class="halo-outline" d="M40 175 Q260 54 500 54 Q740 54 960 175 M54 213 Q270 99 500 99 Q730 99 946 213"/>
<g id="ersPanel" transform="translate(60 155) rotate(-22)">
 <path class="panel" d="M0 6 Q110 -6 220 0 L220 53 Q110 47 0 59Z"/>
 <text class="label" x="12" y="20">ERS BATTERY</text><text id="ersPctText" class="value" x="207" y="20" text-anchor="end">—</text>
 <rect class="track" x="12" y="31" width="195" height="11" rx="2"/><rect id="ersBar" class="ers" x="12" y="31" width="0" height="11" rx="2"/>
</g>
<g id="brakePanel" transform="translate(305 76) rotate(-10)">
 <path class="panel" d="M0 3 Q55 -2 110 0 L110 48 Q55 47 0 51Z"/>
 <rect class="track" x="17" y="13" width="76" height="5" rx="2"/><rect id="brakeBar" class="brake" x="17" y="13" width="0" height="5" rx="2"/>
 <text class="label" x="55" y="36" text-anchor="middle">BRAKE</text>
</g>
<g id="speedPod" transform="translate(500 92)">
 <circle class="panel" cx="0" cy="0" r="67"/>
 <g id="rpmSegments"></g><text class="small" x="0" y="-25" text-anchor="middle">KM/H</text>
 <text id="speedVal" class="speed" x="0" y="6" text-anchor="middle">—</text>
 <text id="gearInPod" class="gear" x="0" y="32" text-anchor="middle">N</text>
 <text class="small" x="0" y="44" text-anchor="middle">GEAR</text>
</g>
<g id="throttlePanel" transform="translate(585 57) rotate(10)">
 <path class="panel" d="M0 0 Q55 -2 110 3 L110 51 Q55 47 0 48Z"/>
 <rect class="track" x="17" y="13" width="76" height="5" rx="2"/><rect id="throttleBar" class="throttle" x="17" y="13" width="0" height="5" rx="2"/>
 <text class="label" x="55" y="36" text-anchor="middle">THROTTLE</text>
</g>
<g id="gearsPanel" transform="translate(716 90) rotate(23)">
 <path class="panel" d="M0 0 Q90 0 184 6 L184 61 Q90 54 0 54Z"/>
 <text class="label" x="10" y="17">GEARS</text><text id="rpmNumText" class="small" x="174" y="17" text-anchor="end">— RPM</text>
 <g id="gearStrip" transform="translate(10 25) scale(.82)"></g><path class="rail" d="M10 49H174"/>
</g>
<g id="drsBadge" transform="translate(889 174) rotate(27)"><rect width="63" height="24" rx="4"/><text id="drsText" class="label" x="31.5" y="16" text-anchor="middle">DRS OFF</text></g>
<g id="tyres" transform="translate(500 168)"><text id="tyreText" class="small" text-anchor="middle">FL —  FR —  RL —  RR —</text></g>
</svg>
<nav id="controls" class="pywebview-drag-region" aria-label="Controles da HUD"><span>HALO / MOVER</span><button id="lockButton">Travar · F8</button><button id="centerButton">Centralizar</button><button id="closeButton" aria-label="Fechar HUD">×</button></nav>
<div id="connection" role="status">CONECTANDO AO BACKEND</div>
</main><script type="module" src="halo.js"></script></body></html>
