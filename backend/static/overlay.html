<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 24 Live HUD Overlay</title>
  <!-- Google Fonts: Rajdhani & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800;900&family=Rajdhani:wght@600;700;800;900&family=Titillium+Web:wght@600;700;900&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --accent-color: #00D2BE;
      --accent-glow: rgba(0, 210, 190, 0.45);
      --halo-rail: #00D2BE;
    }

    * {
      box-sizing: border-box;
    }

    /* True 32-bit Transparent Canvas */
    html,
    body {
      background-color: transparent !important;
      background: transparent !important;
      margin: 0 !important;
      padding: 10px !important;
      border: none !important;
      outline: none !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Rajdhani', system-ui, sans-serif;
    }

    /* Win32 Native Drag Region */
    .pywebview-drag-region {
      -webkit-app-region: drag;
      cursor: grab;
    }

    .pywebview-drag-region:active {
      cursor: grabbing;
    }

    /* AUTHENTIC AERODYNAMIC HALO CHASSIS - Identical to Studio Browser (Rounded + Glassmorphism) */
    .halo-chassis {
      background: linear-gradient(135deg, rgba(14, 20, 34, 0.72) 0%, rgba(7, 10, 18, 0.82) 100%) !important;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-radius: 20px !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      outline: none !important;
      box-shadow: 
        0 14px 34px -8px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.60) !important;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    /* CENTER SPEEDOMETER POD (Frosted Glass) */
    .halo-speed-pod {
      background: radial-gradient(circle at 45% 35%, rgba(26, 38, 60, 0.68) 0%, rgba(8, 12, 22, 0.84) 100%) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
      box-shadow: 
        0 0 22px var(--accent-glow, rgba(0, 210, 190, 0.35)),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        inset 0 0 18px rgba(0, 0, 0, 0.85) !important;
      border-radius: 50%;
      width: 112px;
      height: 112px;
      position: relative;
    }

    /* RPM Circular Arc */
    .rpm-arc-svg {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 124px;
      height: 124px;
      pointer-events: none;
      transform: rotate(-90deg);
    }

    .rpm-arc-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 4;
    }

    .rpm-arc-meter {
      fill: none;
      stroke: var(--accent-color, #00D2BE);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 360;
      stroke-dashoffset: 360;
      transition: stroke-dashoffset 0.05s linear, stroke 0.15s ease;
      filter: drop-shadow(0 0 4px var(--accent-color, #00D2BE));
    }

    .rpm-arc-redline {
      stroke: #FF1744 !important;
      filter: drop-shadow(0 0 8px #FF1744) !important;
    }

    /* VERTICAL SEGMENTED PEDAL GAUGES (Frosted Glass Container) */
    .pedal-meter-container {
      display: flex;
      flex-direction: column-reverse;
      gap: 2.5px;
      width: 24px;
      height: 80px;
      background: rgba(10, 15, 25, 0.60);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 12px rgba(0, 0, 0, 0.8);
    }

    .pedal-seg {
      width: 100%;
      height: 4px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.08);
      transition: background-color 0.04s ease, box-shadow 0.04s ease;
    }

    .pedal-seg.active-thr {
      background: #00E676 !important;
      box-shadow: 0 0 6px rgba(0, 230, 118, 0.9) !important;
    }

    .pedal-seg.active-brk {
      background: #FF1744 !important;
      box-shadow: 0 0 6px rgba(255, 23, 68, 0.9) !important;
    }

    /* GEAR STRIP (R N 1 2 3 4 5 6 7 8) */
    .gear-item {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.35);
      font-size: 10.5px;
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.08s ease;
    }

    .gear-item.active {
      color: #000000 !important;
      background-color: var(--accent-color, #00D2BE) !important;
      box-shadow: 0 0 12px var(--accent-color, #00D2BE) !important;
      font-weight: 900 !important;
      transform: scale(1.15);
    }

    .gear-item.active-reverse {
      color: #ffffff !important;
      background-color: #ef4444 !important;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.95) !important;
      font-weight: 900 !important;
      transform: scale(1.15);
    }

    /* SHIFT LIGHT BAR (15 LEDs) */
    .led-shift {
      flex: 1;
      height: 6px;
      border-radius: 1.5px;
      background-color: rgba(255, 255, 255, 0.08);
      transition: none;
    }

    .led-shift.active-green { background-color: #00E676; box-shadow: 0 0 8px #00E676; }
    .led-shift.active-red { background-color: #E10600; box-shadow: 0 0 8px #E10600; }
    .led-shift.active-purple { background-color: #9B51E0; box-shadow: 0 0 10px #9B51E0; }

    /* FROSTED GLASS SURFACE STYLING */
    .wing-block {
      background: rgba(14, 20, 32, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 5px 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body class="w-full h-full p-2.5 m-0 select-none flex flex-col justify-center items-center overflow-hidden">

  <!-- UNIFIED F1 REALISTIC HALO COCKPIT HUD (Matches index.html 1:1) -->
  <div id="hudRoot" class="halo-chassis w-full h-full p-2 flex flex-col justify-between relative select-none">
    
    <!-- 0. TOP SLIM HEADER: Drag Handle & Quick Actions -->
    <div id="dragHeader" class="pywebview-drag-region w-full h-5 px-2 flex items-center justify-between text-xs font-mono select-none">
      <div class="flex items-center gap-2">
        <i data-lucide="grip-horizontal" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span class="font-bold tracking-widest uppercase text-[9px] text-gray-300">F1 HALO COCKPIT</span>
        <span id="coordsBadge" class="hidden sm:inline-block px-1.5 py-0.2 rounded bg-cyan-400/10 text-cyan-300 font-mono text-[8px] border border-cyan-400/20">LIVE 60Hz</span>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="btnResetPos" onclick="centerHud(event)" class="px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 text-gray-300 text-[9px] font-semibold transition active:scale-95" title="Centralizar na tela">
          Centralizar
        </button>
      </div>
    </div>

    <!-- 1. MAIN TELEMETRY ARCH (Exact 1:1 F1 Halo HUD Geometry) -->
    <div class="w-full flex-1 flex items-center justify-between px-1 my-0.5 min-h-0 relative">
      
      <!-- LEFT WING: DRS, ERS & BRAKE SEGMENTS -->
      <div class="flex-1 flex items-center justify-end gap-3 pr-2">
        <!-- Left Wing Sub-panel: DRS & ERS Battery -->
        <div class="flex flex-col gap-1.5 justify-center">
          <div class="flex items-center gap-1.5">
            <span class="text-[9px] font-mono font-bold text-gray-400 w-7">ERS</span>
            <div class="w-24 h-2.5 bg-black/70 rounded border border-white/15 overflow-hidden p-0.5">
              <div id="ersBar" class="h-full rounded-sm bg-gradient-to-r from-emerald-400 via-cyan-400 to-blue-500 transition-none" style="width: 82%;"></div>
            </div>
            <span id="ersPctText" class="text-[9px] font-mono font-bold text-emerald-400 w-7 text-right">82%</span>
          </div>

          <div id="drsBadge" class="flex items-center justify-center gap-1 px-3 py-1 rounded bg-white/5 border border-white/10 text-[10px] font-mono font-bold text-gray-400 transition-all">
            <i data-lucide="wind" class="w-3 h-3"></i>
            <span id="drsText">DRS</span>
          </div>
        </div>

        <!-- Vertical BRAKE Meter (Segmented LEDs) -->
        <div class="flex flex-col items-center gap-1">
          <div class="pedal-meter-container" id="brakeMeter">
            <!-- 12 LED segments generated via JS -->
          </div>
          <span class="text-[8px] font-mono font-black text-red-400 tracking-wider">BRAKE</span>
        </div>
      </div>

      <!-- CENTER POD: ICONIC CIRCULAR SPEED DIAL WITH CIRCULAR RPM TACHOMETER -->
      <div class="flex flex-col items-center justify-center flex-shrink-0 mx-2 z-10">
        <div class="halo-speed-pod flex flex-col items-center justify-center">
          <svg class="rpm-arc-svg" viewBox="0 0 124 124">
            <circle class="rpm-arc-bg" cx="62" cy="62" r="54"></circle>
            <circle id="rpmArcMeter" class="rpm-arc-meter" cx="62" cy="62" r="54"></circle>
          </svg>

          <span class="text-[8px] font-mono font-bold text-gray-400 tracking-widest uppercase -mt-1">SPEED</span>
          <span id="speedVal" class="text-4xl font-black font-display text-white tracking-tighter leading-none drop-shadow-[0_0_12px_rgba(255,255,255,0.4)]">0</span>
          
          <!-- Center Pod Gear Indicator (Clean, without KM/H) -->
          <div class="flex items-center justify-center mt-0.5">
            <span id="gearInPod" class="text-[12px] font-black font-mono text-cyan-300">N</span>
          </div>
        </div>
      </div>

      <!-- RIGHT WING: THROTTLE SEGMENTS, GEAR STRIP & RPM / SHIFT LIGHTS -->
      <div class="flex-1 flex items-center justify-start gap-3 pl-2">
        <!-- Vertical THROTTLE Meter (Segmented LEDs) -->
        <div class="flex flex-col items-center gap-1">
          <div class="pedal-meter-container" id="throttleMeter">
            <!-- 12 LED segments generated via JS -->
          </div>
          <span class="text-[8px] font-mono font-black text-green-400 tracking-wider">THROTTLE</span>
        </div>

        <!-- Gear Sequence Strip (R N 1 2 3 4 5 6 7 8) & RPM readout -->
        <div class="flex flex-col gap-1.5 justify-center">
          <div class="flex flex-col gap-0.5">
            <div class="flex items-center justify-between text-[8px] font-mono text-gray-400 font-bold uppercase">
              <span>GEAR</span>
              <span id="rpmNumText" class="text-white font-mono">0 RPM</span>
            </div>
            <div class="flex items-center gap-[3px] p-0.5 rounded bg-black/60 border border-white/10" id="gearStrip">
              <span id="gR" class="gear-item">R</span>
              <span id="gN" class="gear-item active">N</span>
              <span id="g1" class="gear-item">1</span>
              <span id="g2" class="gear-item">2</span>
              <span id="g3" class="gear-item">3</span>
              <span id="g4" class="gear-item">4</span>
              <span id="g5" class="gear-item">5</span>
              <span id="g6" class="gear-item">6</span>
              <span id="g7" class="gear-item">7</span>
              <span id="g8" class="gear-item">8</span>
            </div>
          </div>

          <!-- 15-LED Shift Light Bar -->
          <div class="w-full flex gap-1 p-0.5 bg-black/60 rounded border border-white/10" id="ledsContainer">
            <!-- 15 LEDs dynamically injected -->
          </div>
        </div>

        <!-- 4-Corner Tyres & Brakes Thermal Telemetry -->
        <div class="wing-block flex flex-col gap-1 text-[8px] font-mono min-w-[96px] flex-shrink-0">
          <div class="flex justify-between items-center text-gray-400 border-b border-white/10 pb-0.5">
            <span class="font-bold">TYRES</span>
            <span class="text-cyan-400">°C</span>
          </div>
          <div class="grid grid-cols-2 gap-x-2.5 gap-y-0.5 whitespace-nowrap">
            <div class="flex items-center gap-1 justify-between">
              <span class="text-gray-500 font-bold">FL</span>
              <span id="tyreFL" class="text-green-400 font-bold">90°</span>
            </div>
            <div class="flex items-center gap-1 justify-between">
              <span class="text-gray-500 font-bold">FR</span>
              <span id="tyreFR" class="text-green-400 font-bold">90°</span>
            </div>
            <div class="flex items-center gap-1 justify-between">
              <span class="text-gray-500 font-bold">RL</span>
              <span id="tyreRL" class="text-green-400 font-bold">90°</span>
            </div>
            <div class="flex items-center gap-1 justify-between">
              <span class="text-gray-500 font-bold">RR</span>
              <span id="tyreRR" class="text-green-400 font-bold">90°</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- 2. FOOTER: Watermark & Telemetry Info -->
    <div class="w-full flex items-center justify-between px-2 text-[9px] font-mono text-gray-400 select-none">
      <!-- Watermark: made by augrocky™ -->
      <div id="augrockyTrademark" class="flex items-center gap-1">
        <span class="tracking-wider uppercase font-medium">made by <span class="font-bold text-gray-200">augrocky</span><span id="trademarkSymbolStudio" class="text-white font-bold text-[9px] ml-0.5">™</span></span>
      </div>

      <div class="flex items-center gap-2 text-[8px] text-gray-500 uppercase tracking-widest">
        <span>F1 REALISTIC HALO</span>
        <span>•</span>
        <span id="fpsIndicator" class="text-cyan-400 font-bold">60 FPS</span>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // DOM Elements
    const brakeMeter = document.getElementById('brakeMeter');
    const throttleMeter = document.getElementById('throttleMeter');
    const ledsContainer = document.getElementById('ledsContainer');
    const rpmArcMeter = document.getElementById('rpmArcMeter');
    const speedVal = document.getElementById('speedVal');
    const gearInPod = document.getElementById('gearInPod');
    const rpmNumText = document.getElementById('rpmNumText');
    const ersBar = document.getElementById('ersBar');
    const ersPctText = document.getElementById('ersPctText');
    const drsBadge = document.getElementById('drsBadge');
    const drsText = document.getElementById('drsText');
    const tyreFL = document.getElementById('tyreFL');
    const tyreFR = document.getElementById('tyreFR');
    const tyreRL = document.getElementById('tyreRL');
    const tyreRR = document.getElementById('tyreRR');

    // 12 Pedal Segments (Exact match with index.html)
    const NUM_PEDAL_SEGS = 12;
    for (let i = 0; i < NUM_PEDAL_SEGS; i++) {
      const segB = document.createElement('div');
      segB.className = 'pedal-seg';
      brakeMeter.appendChild(segB);

      const segT = document.createElement('div');
      segT.className = 'pedal-seg';
      throttleMeter.appendChild(segT);
    }
    const brakeSegs = brakeMeter.querySelectorAll('.pedal-seg');
    const throttleSegs = throttleMeter.querySelectorAll('.pedal-seg');

    // 15 Shift LEDs (Exact match with index.html: 5 Green, 5 Red, 5 Purple)
    const NUM_LEDS = 15;
    for (let i = 0; i < NUM_LEDS; i++) {
      const led = document.createElement('div');
      led.className = 'led-shift';
      ledsContainer.appendChild(led);
    }
    const leds = ledsContainer.querySelectorAll('.led-shift');

    // Gear IDs
    const gearIds = ['gR', 'gN', 'g1', 'g2', 'g3', 'g4', 'g5', 'g6', 'g7', 'g8'];

    // Update Shift Lights & Arc
    const CIRCUMFERENCE = 2 * Math.PI * 54; // ~339.29
    function updateRpm(rpm, maxRpm) {
      const idle = 4000;
      const cleanMax = maxRpm > idle ? maxRpm : 13500;
      const cleanRpm = Math.max(0, Math.min(rpm, cleanMax));
      
      const pct = Math.max(0, Math.min(1, (cleanRpm - idle) / (cleanMax - idle)));
      const activeCount = Math.floor(pct * NUM_LEDS);

      leds.forEach((led, idx) => {
        if (idx < activeCount) {
          if (idx < 5) led.className = 'led-shift active-green';
          else if (idx < 10) led.className = 'led-shift active-red';
          else led.className = 'led-shift active-purple';
        } else {
          led.className = 'led-shift';
        }
      });

      if (rpmArcMeter) {
        const offset = CIRCUMFERENCE - (pct * CIRCUMFERENCE);
        rpmArcMeter.style.strokeDashoffset = offset;
        if (pct >= 0.94) {
          rpmArcMeter.classList.add('rpm-arc-redline');
        } else {
          rpmArcMeter.classList.remove('rpm-arc-redline');
        }
      }

      if (rpmNumText) {
        rpmNumText.textContent = `${Math.round(cleanRpm)} RPM`;
      }
    }

    // Update Gear
    function updateGear(gear) {
      gearIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = 'gear-item';
      });

      let targetId = 'gN';
      let charStr = 'N';
      const gNum = Number(gear);

      if (gear === -1 || gear === '-1' || gear === 'R' || gear === 'r' || gNum === -1) {
        targetId = 'gR';
        charStr = 'R';
      } else if (gNum >= 1 && gNum <= 8) {
        targetId = `g${gNum}`;
        charStr = `${gNum}`;
      } else {
        targetId = 'gN';
        charStr = 'N';
      }

      const activeEl = document.getElementById(targetId);
      if (activeEl) {
        if (targetId === 'gR') activeEl.className = 'gear-item active active-reverse';
        else activeEl.className = 'gear-item active';
      }

      if (gearInPod) {
        gearInPod.textContent = charStr;
        gearInPod.className = charStr === 'R' ? 'text-[12px] font-black font-mono text-red-400' :
          charStr === 'N' ? 'text-[12px] font-black font-mono text-yellow-400' :
          'text-[12px] font-black font-mono text-cyan-300';
      }
    }

    // Update Pedals
    function updatePedals(throttlePct, brakePct) {
      let tPct = Number(throttlePct) || 0;
      if (tPct > 0 && tPct <= 1.0) tPct *= 100;
      let bPct = Number(brakePct) || 0;
      if (bPct > 0 && bPct <= 1.0) bPct *= 100;

      const activeThr = Math.round((tPct / 100) * NUM_PEDAL_SEGS);
      const activeBrk = Math.round((bPct / 100) * NUM_PEDAL_SEGS);

      throttleSegs.forEach((seg, idx) => {
        if (idx < activeThr) seg.className = 'pedal-seg active-thr';
        else seg.className = 'pedal-seg';
      });

      brakeSegs.forEach((seg, idx) => {
        if (idx < activeBrk) seg.className = 'pedal-seg active-brk';
        else seg.className = 'pedal-seg';
      });
    }

    // Update DRS
    function updateDrs(state) {
      if (!drsBadge) return;
      if (state === 2 || state === '2' || state === 'active') {
        drsBadge.className = 'flex items-center justify-center gap-1 px-3 py-1 rounded bg-green-500 border border-green-400 text-black font-black text-[10px] font-mono shadow-[0_0_12px_rgba(0,230,118,0.8)]';
        drsText.textContent = 'DRS OPEN';
      } else if (state === 1 || state === '1' || state === 'ready') {
        drsBadge.className = 'flex items-center justify-center gap-1 px-3 py-1 rounded bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold text-[10px] font-mono shadow-[0_0_8px_rgba(0,210,190,0.5)]';
        drsText.textContent = 'DRS AVAIL';
      } else {
        drsBadge.className = 'flex items-center justify-center gap-1 px-3 py-1 rounded bg-white/5 border border-white/10 text-[10px] font-mono font-bold text-gray-400';
        drsText.textContent = 'DRS';
      }
    }

    // Update ERS
    function updateErs(pct) {
      const cleanPct = Math.max(0, Math.min(100, pct));
      if (ersBar) ersBar.style.width = `${cleanPct}%`;
      if (ersPctText) ersPctText.textContent = `${Math.round(cleanPct)}%`;
    }

    // Format Tyre Temperatures
    function formatTyre(el, temp) {
      if (!el) return;
      el.textContent = `${Math.round(temp)}°`;
      if (temp < 85) el.className = 'text-cyan-400 font-bold';
      else if (temp <= 108) el.className = 'text-green-400 font-bold';
      else el.className = 'text-red-400 font-bold';
    }

    // Render Telemetry Frame
    function renderTelemetry(data) {
      if (!data) return;
      
      const speed = Number(data.speed !== undefined ? data.speed : 0);
      if (speedVal) speedVal.textContent = Math.round(speed);

      const rpm = Number(data.engineRPM !== undefined ? data.engineRPM : (data.engine_rpm || 0));
      const maxRpm = Number(data.maxRPM !== undefined ? data.maxRPM : (data.max_rpm || 13500));
      updateRpm(rpm, maxRpm);

      updateGear(data.gear !== undefined ? data.gear : 0);
      updatePedals(data.throttle, data.brake);

      const drsState = data.drs === 1 ? 2 : (data.drsAllowed === 1 ? 1 : 0);
      updateDrs(drsState);

      let ersPct = 100;
      if (data.ersStoreEnergy !== undefined) {
        ersPct = Math.min(100, Math.max(0, (data.ersStoreEnergy / 4000000) * 100));
      } else if (data.ers_store !== undefined) {
        ersPct = data.ers_store;
      }
      updateErs(ersPct);

      const tyres = data.tyresSurfaceTemperature || data.tyre_surface_temp;
      if (tyres && tyres.length >= 4) {
        if (data.tyresSurfaceTemperature) {
          formatTyre(tyreFL, tyres[2]);
          formatTyre(tyreFR, tyres[3]);
          formatTyre(tyreRL, tyres[0]);
          formatTyre(tyreRR, tyres[1]);
        } else {
          formatTyre(tyreFL, tyres[0]);
          formatTyre(tyreFR, tyres[1]);
          formatTyre(tyreRL, tyres[2]);
          formatTyre(tyreRR, tyres[3]);
        }
      }
    }

    // Accent Color Application
    function applyAccentColor(colorHex) {
      if (!colorHex) return;
      document.documentElement.style.setProperty('--accent-color', colorHex);
      document.documentElement.style.setProperty('--accent-glow', `${colorHex}55`);
      document.documentElement.style.setProperty('--halo-rail', colorHex);
    }

    // Window Centering via PyWebview API
    window.centerHud = function(e) {
      if (e) e.stopPropagation();
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.center_hud();
      }
    };

    // WEBSOCKET TELEMETRY CLIENT (60Hz)
    let ws = null;
    function connectWs() {
      const loc = window.location;
      const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = loc.hostname || '127.0.0.1';
      const wsPort = loc.port || '8000';
      const wsUrl = `${wsProto}//${wsHost}:${wsPort}/ws/telemetry`;
      
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        const badge = document.getElementById('coordsBadge');
        if (badge) {
          badge.textContent = 'ONLINE (60Hz)';
          badge.className = 'hidden sm:inline-block px-1.5 py-0.2 rounded bg-green-500/20 text-green-300 font-mono text-[8px] border border-green-500/30';
        }
      };

      ws.onmessage = (evt) => {
        try {
          const raw = JSON.parse(evt.data);
          if (raw.type === 'config_update') {
            const cfg = raw.config || raw.data || raw;
            if (cfg && cfg.accentColor) applyAccentColor(cfg.accentColor);
            return;
          }
          if (raw.accentColor && raw.speed === undefined) {
            applyAccentColor(raw.accentColor);
            return;
          }

          const data = (raw.type === 'telemetry' && raw.data) ? raw.data : raw;
          if (data && (data.speed !== undefined || data.engineRPM !== undefined || data.engine_rpm !== undefined)) {
            renderTelemetry(data);
          }
        } catch (e) { }
      };

      ws.onclose = () => {
        const badge = document.getElementById('coordsBadge');
        if (badge) {
          badge.textContent = 'AGUARDANDO F1...';
          badge.className = 'hidden sm:inline-block px-1.5 py-0.2 rounded bg-yellow-500/20 text-yellow-300 font-mono text-[8px] border border-yellow-500/30';
        }
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch (e) { }
      };
    }

    // INITIAL LOAD
    async function loadInitialConfig() {
      try {
        const configUrl = window.location.protocol === 'file:'
          ? 'http://127.0.0.1:8000/api/config'
          : '/api/config';
        const res = await fetch(configUrl);
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.accentColor) applyAccentColor(cfg.accentColor);
        }
      } catch (e) { }
    }

    loadInitialConfig();
    connectWs();
  </script>
</body>
