<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 24 Live Halo HUD Overlay</title>
  <!-- Google Fonts: Rajdhani & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800;900&family=Rajdhani:wght@600;700;800;900&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: transparent !important;
      background-color: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      outline: none !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Rajdhani', system-ui, sans-serif;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Win32 Native Drag Region */
    .pywebview-drag-region {
      -webkit-app-region: drag;
      cursor: grab;
    }

    .pywebview-drag-region:active {
      cursor: grabbing;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }

    /* Hover controls transition */
    .hud-control-btn {
      opacity: 0.6;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .hud-control-btn:hover {
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
</head>

<body class="w-full h-full p-0 m-0 select-none flex flex-col justify-center items-center overflow-hidden relative">

  <!-- DISCREET QUICK CONTROLS (Positioned at top right of the chassis) -->
  <div class="absolute top-1 right-14 z-50 flex items-center gap-1.5 no-drag font-mono text-[9px]">
    <span id="telemetry-badge"
      class="px-2 py-0.5 rounded-full font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 shadow-sm">
      LIVE 60Hz
    </span>
    <button onclick="toggleStressLoop()" id="btnStressLoop"
      class="hud-control-btn px-2 py-0.5 rounded-full bg-slate-900/80 hover:bg-slate-800 text-gray-300 hover:text-white border border-white/15"
      title="Alternar Simulação de Teste (Atalho: Tecla H)">
      [H] Stress
    </button>
    <button onclick="centerHud(event)"
      class="hud-control-btn px-2 py-0.5 rounded-full bg-slate-900/80 hover:bg-slate-800 text-gray-300 hover:text-white border border-white/15"
      title="Centralizar HUD na tela">
      Centralizar
    </button>
    <button onclick="closeHud(event)"
      class="hud-control-btn w-5 h-5 flex items-center justify-center rounded-full bg-red-500/20 hover:bg-red-500/40 text-red-300 hover:text-white text-xs font-bold border border-red-500/30"
      title="Fechar HUD">
      &times;
    </button>
  </div>

  <!-- MAIN UNIFIED VECTOR F1 HALO HUD (ViewBox: 0 0 960 210) -->
  <main id="hud-container" class="relative w-full h-full select-none font-['Rajdhani'] flex items-center justify-center pywebview-drag-region">
    <svg viewBox="0 0 960 210" class="w-full h-full drop-shadow-[0_10px_22px_rgba(0,0,0,0.75)] filter pointer-events-none">
      <defs>
        <!-- ERS Battery Gradient -->
        <linearGradient id="ersGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00E5FF" />
          <stop offset="100%" stop-color="#0077B6" />
        </linearGradient>

        <!-- Tachometer RPM Gradient -->
        <linearGradient id="rpmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00FF66" />
          <stop offset="68%" stop-color="#FFDD00" />
          <stop offset="92%" stop-color="#FF0055" />
        </linearGradient>

        <!-- Master Halo Chassis Gradient -->
        <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(14, 24, 42, 0.88)" />
          <stop offset="50%" stop-color="rgba(8, 14, 26, 0.95)" />
          <stop offset="100%" stop-color="rgba(14, 24, 42, 0.88)" />
        </linearGradient>

        <!-- Center Pod Radial Depth -->
        <radialGradient id="podRadial" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(20, 36, 60, 0.90)" />
          <stop offset="85%" stop-color="rgba(6, 12, 22, 0.96)" />
        </radialGradient>

        <!-- Accent Glow -->
        <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- 1. MASTER CONTINUOUS CURVED HALO CHASSIS -->
      <path d="
        M 115,75
        L 385,52
        Q 430,22 480,22
        Q 530,22 575,52
        L 845,75
        Q 860,82 860,98
        L 860,152
        Q 860,168 845,175
        L 575,155
        Q 530,190 480,190
        Q 430,190 385,155
        L 115,175
        Q 100,168 100,152
        L 100,98
        Q 100,82 115,75
        Z
      " fill="url(#chassisGrad)" stroke="rgba(0, 229, 255, 0.40)" stroke-width="1.5" />

      <!-- Aero Accents on Halo Wings -->
      <path d="M 120,79 L 380,56" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <path d="M 580,56 L 840,79" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

      <!-- 2. ASA ESQUERDA: ERS BATTERY & BRAKE -->
      <text x="135" y="92" fill="#94A3B8" font-size="11" font-weight="800" letter-spacing="1.2">ERS BATTERY</text>
      <text id="ers-percent" x="365" y="92" text-anchor="end" fill="#FFFFFF" font-size="20" font-weight="900" font-family="'JetBrains Mono'" class="tabular-nums">100%</text>
      
      <!-- ERS Progress Bar -->
      <rect x="135" y="102" width="230" height="10" rx="3" fill="rgba(255,255,255,0.08)" />
      <rect id="ers-bar" x="135" y="102" width="230" height="10" rx="3" fill="url(#ersGradient)" />
      
      <!-- Brake Bar -->
      <text x="135" y="136" fill="#EF4444" font-size="11" font-weight="800" letter-spacing="1">BRAKE</text>
      <rect x="190" y="127" width="175" height="9" rx="2.5" fill="rgba(255,255,255,0.08)" />
      <rect id="brake-bar" x="190" y="127" width="0" height="9" rx="2.5" fill="#EF4444" />

      <!-- DRS Status Badge -->
      <g id="drs-badge">
        <rect id="drs-box" x="135" y="150" width="65" height="18" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text id="drs-text" x="167" y="163" text-anchor="middle" fill="#94A3B8" font-size="9" font-weight="800" font-family="'JetBrains Mono'">DRS</text>
      </g>
      <text x="365" y="162" text-anchor="end" fill="rgba(255,255,255,0.25)" font-size="8" font-weight="700" letter-spacing="1.5">F1 BROADCAST</text>

      <!-- 3. DOMO CENTRAL: VELOCÍMETRO DUPLO COM TACÔMETRO ARREDONDADO -->
      <circle cx="480" cy="105" r="52" fill="url(#podRadial)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
      
      <!-- Speed Progress Arc (r=48, circumference=301.59) -->
      <circle cx="480" cy="105" r="48" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5" />
      <circle id="speed-arc" cx="480" cy="105" r="48" fill="none" stroke="#00E5FF" stroke-width="4.5"
        stroke-dasharray="301.59" stroke-dashoffset="301.59" stroke-linecap="round"
        transform="rotate(-90 480 105)" filter="url(#accentGlow)" />
      
      <!-- Speed Readouts -->
      <text x="480" y="73" text-anchor="middle" fill="#94A3B8" font-size="9" font-weight="800" letter-spacing="1">KM/H</text>
      <text id="speed-kmh" x="480" y="108" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="900" font-family="'JetBrains Mono'" class="tabular-nums">0</text>
      <line x1="455" y1="114" x2="505" y2="114" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <text id="speed-mph" x="480" y="130" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700" font-family="'JetBrains Mono'" class="tabular-nums">0</text>
      <text x="480" y="141" text-anchor="middle" fill="#64748B" font-size="8" font-weight="800" letter-spacing="0.5">MPH</text>
      <text id="gear-center" x="480" y="161" text-anchor="middle" fill="#00E5FF" font-size="14" font-weight="900" font-family="'JetBrains Mono'">N</text>

      <!-- 4. ASA DIREITA: THROTTLE, MARCHAS & RPM -->
      <text x="595" y="92" fill="#10B981" font-size="11" font-weight="800" letter-spacing="1">THROTTLE</text>
      <rect x="665" y="83" width="160" height="9" rx="2.5" fill="rgba(255,255,255,0.08)" />
      <rect id="throttle-bar" x="665" y="83" width="0" height="9" rx="2.5" fill="#10B981" />

      <!-- Horizontal Gear Strip (R N 1 2 3 4 5 6 7 8) -->
      <g id="gears-row" font-family="'JetBrains Mono'" font-size="13" font-weight="700">
        <text x="597" y="116" id="gear-R" fill="#64748B">R</text>
        <text x="620" y="116" id="gear-N" fill="#00E5FF" font-size="15" font-weight="900">N</text>
        <text x="643" y="116" id="gear-1" fill="#64748B">1</text>
        <text x="666" y="116" id="gear-2" fill="#64748B">2</text>
        <text x="689" y="116" id="gear-3" fill="#64748B">3</text>
        <text x="712" y="116" id="gear-4" fill="#64748B">4</text>
        <text x="735" y="116" id="gear-5" fill="#64748B">5</text>
        <text x="758" y="116" id="gear-6" fill="#64748B">6</text>
        <text x="781" y="116" id="gear-7" fill="#64748B">7</text>
        <text x="804" y="116" id="gear-8" fill="#64748B">8</text>
      </g>

      <!-- RPM Tachometer Bar & Number -->
      <text x="595" y="138" fill="#94A3B8" font-size="10" font-weight="800" letter-spacing="1">RPM x1000</text>
      <text id="rpm-num" x="825" y="138" text-anchor="end" fill="#CBD5E1" font-size="12" font-weight="800" font-family="'JetBrains Mono'" class="tabular-nums">0</text>
      <rect x="595" y="146" width="230" height="10" rx="3" fill="rgba(255,255,255,0.08)" />
      <rect id="rpm-bar" x="595" y="146" width="0" height="10" rx="3" fill="url(#rpmGradient)" />
      
      <!-- OVERTAKE Luminous Badge -->
      <g id="overtake-badge" style="transition: opacity 0.15s ease;" opacity="0">
        <rect x="745" y="162" width="80" height="16" rx="3" fill="#E11D48" />
        <text x="785" y="174" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="900" font-family="'JetBrains Mono'" letter-spacing="1">OVERTAKE</text>
      </g>
    </svg>
  </main>

  <script>
    lucide.createIcons();

    // Direct DOM nodes for 60Hz loop
    const speedKmhEl = document.getElementById('speed-kmh');
    const speedMphEl = document.getElementById('speed-mph');
    const speedArcEl = document.getElementById('speed-arc');
    const ersPercentEl = document.getElementById('ers-percent');
    const ersBarEl = document.getElementById('ers-bar');
    const brakeBarEl = document.getElementById('brake-bar');
    const throttleBarEl = document.getElementById('throttle-bar');
    const rpmBarEl = document.getElementById('rpm-bar');
    const rpmNumEl = document.getElementById('rpm-num');
    const gearCenterEl = document.getElementById('gear-center');
    const overtakeBadgeEl = document.getElementById('overtake-badge');
    const drsBoxEl = document.getElementById('drs-box');
    const drsTextEl = document.getElementById('drs-text');
    const telemetryBadgeEl = document.getElementById('telemetry-badge');
    const btnStressLoopEl = document.getElementById('btnStressLoop');

    // Gear references
    const gearList = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];
    const gearEls = {};
    gearList.forEach(g => {
      gearEls[g] = document.getElementById(`gear-${g}`);
    });

    const SPEED_CIRCUMFERENCE = 301.59; // 2 * Math.PI * 48
    let currentGear = 'N';
    let isStressLoopActive = false;
    let stressReqId = null;

    // DIRECT HIGH-PERFORMANCE RENDERER
    function applyTelemetryDirect(t) {
      // 1. Speed (KM/H & MPH)
      const kmh = Math.round(Number(t.speed) || 0);
      const mph = Math.round(kmh * 0.621371);
      speedKmhEl.textContent = kmh;
      speedMphEl.textContent = mph;

      // Arc progress (0 to 360 km/h)
      const spdRatio = Math.min(1, Math.max(0, kmh / 360));
      const dashOffset = SPEED_CIRCUMFERENCE * (1 - spdRatio);
      speedArcEl.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));

      // 2. ERS Battery (0 to 100%)
      let ersPct = 100;
      if (t.ersPercent !== undefined) ersPct = Number(t.ersPercent);
      else if (t.ers_store !== undefined) ersPct = Number(t.ers_store);
      else if (t.ersStoreEnergy !== undefined) ersPct = (Number(t.ersStoreEnergy) / 4000000) * 100;
      ersPct = Math.max(0, Math.min(100, ersPct));
      
      ersPercentEl.textContent = `${Math.round(ersPct)}%`;
      ersBarEl.setAttribute('width', (ersPct * 2.3).toFixed(1)); // 230px max

      // 3. Brake (0 to 100%)
      let brkPct = Number(t.brake) || 0;
      if (brkPct > 0 && brkPct <= 1.0) brkPct *= 100;
      brkPct = Math.max(0, Math.min(100, brkPct));
      brakeBarEl.setAttribute('width', (brkPct * 1.75).toFixed(1)); // 175px max

      // 4. Throttle (0 to 100%)
      let thrPct = Number(t.throttle) || 0;
      if (thrPct > 0 && thrPct <= 1.0) thrPct *= 100;
      thrPct = Math.max(0, Math.min(100, thrPct));
      throttleBarEl.setAttribute('width', (thrPct * 1.6).toFixed(1)); // 160px max

      // 5. Gear
      const gRaw = t.gear !== undefined ? t.gear : 0;
      let activeGearStr = 'N';
      if (gRaw === -1 || gRaw === '-1' || gRaw === 'R' || gRaw === 'r') activeGearStr = 'R';
      else if (gRaw >= 1 && gRaw <= 8) activeGearStr = String(gRaw);
      else activeGearStr = 'N';

      if (currentGear !== activeGearStr) {
        currentGear = activeGearStr;
        gearCenterEl.textContent = activeGearStr;
        gearCenterEl.setAttribute('fill', activeGearStr === 'R' ? '#EF4444' : '#00E5FF');

        gearList.forEach(g => {
          const el = gearEls[g];
          if (!el) return;
          if (g === activeGearStr) {
            el.setAttribute('fill', g === 'R' ? '#EF4444' : '#00E5FF');
            el.setAttribute('font-size', '15');
            el.setAttribute('font-weight', '900');
          } else {
            el.setAttribute('fill', '#64748B');
            el.setAttribute('font-size', '13');
            el.setAttribute('font-weight', '700');
          }
        });
      }

      // 6. RPM (0 to 15000)
      const rpm = Number(t.engineRPM !== undefined ? t.engineRPM : (t.engine_rpm || 0));
      const rpmRatio = Math.max(0, Math.min(1, rpm / 15000));
      rpmBarEl.setAttribute('width', (rpmRatio * 230).toFixed(1)); // 230px max
      if (rpmNumEl) rpmNumEl.textContent = Math.round(rpm);

      // 7. Overtake / DRS
      const isOvertake = Boolean(t.overtake || t.ersDeploy);
      overtakeBadgeEl.setAttribute('opacity', isOvertake ? '1' : '0');

      const drsState = t.drs === 1 ? 2 : (t.drsAllowed === 1 ? 1 : 0);
      if (drsBoxEl && drsTextEl) {
        if (drsState === 2) {
          drsBoxEl.setAttribute('fill', '#00E676');
          drsBoxEl.setAttribute('stroke', '#00E676');
          drsTextEl.setAttribute('fill', '#000000');
          drsTextEl.textContent = 'DRS OPEN';
        } else if (drsState === 1) {
          drsBoxEl.setAttribute('fill', 'rgba(0, 229, 255, 0.2)');
          drsBoxEl.setAttribute('stroke', '#00E5FF');
          drsTextEl.setAttribute('fill', '#00E5FF');
          drsTextEl.textContent = 'DRS';
        } else {
          drsBoxEl.setAttribute('fill', 'rgba(255, 255, 255, 0.06)');
          drsBoxEl.setAttribute('stroke', 'rgba(255, 255, 255, 0.12)');
          drsTextEl.setAttribute('fill', '#94A3B8');
          drsTextEl.textContent = 'DRS';
        }
      }
    }

    // WEBSOCKET TELEMETRY
    let ws = null;
    function connectWs() {
      const loc = window.location;
      const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = loc.hostname || '127.0.0.1';
      const wsPort = loc.port || '8000';
      const wsUrl = `${wsProto}//${wsHost}:${wsPort}/ws/telemetry`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        if (!isStressLoopActive && telemetryBadgeEl) {
          telemetryBadgeEl.textContent = 'LIVE 60Hz';
          telemetryBadgeEl.className = 'px-2 py-0.5 rounded-full font-bold bg-green-500/20 text-green-300 border border-green-500/30 shadow-sm';
        }
      };

      ws.onmessage = (evt) => {
        if (isStressLoopActive) return;
        try {
          const raw = JSON.parse(evt.data);
          const data = (raw.type === 'telemetry' && raw.data) ? raw.data : raw;
          if (data && (data.speed !== undefined || data.engineRPM !== undefined || data.engine_rpm !== undefined)) {
            applyTelemetryDirect(data);
          }
        } catch (e) { }
      };

      ws.onclose = () => {
        if (!isStressLoopActive && telemetryBadgeEl) {
          telemetryBadgeEl.textContent = 'AGUARDANDO F1...';
          telemetryBadgeEl.className = 'px-2 py-0.5 rounded-full font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 shadow-sm';
        }
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch (e) { }
      };
    }

    // 60 FPS STRESS LOOP (HOT LAP SIMULATION)
    let stressState = 'accel';
    let stressGear = 1;
    let stressSpeed = 35;
    let stressRpm = 4500;
    let stressThr = 100;
    let stressBrk = 0;
    let stressOvt = false;

    function toggleStressLoop() {
      if (isStressLoopActive) stopStressLoop();
      else startStressLoop();
    }

    function startStressLoop() {
      isStressLoopActive = true;
      stressState = 'accel';
      stressGear = 1;
      stressSpeed = 40;
      stressRpm = 5000;
      stressThr = 100;
      stressBrk = 0;

      if (btnStressLoopEl) {
        btnStressLoopEl.textContent = 'Parar Stress';
        btnStressLoopEl.className = 'hud-control-btn px-2 py-0.5 rounded-full bg-emerald-600 text-white font-bold border border-emerald-400 shadow-md';
      }
      telemetryBadgeEl.textContent = 'STRESS LOOP';
      telemetryBadgeEl.className = 'px-2 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 shadow-sm';

      runStressFrame();
    }

    function stopStressLoop() {
      isStressLoopActive = false;
      if (stressReqId) {
        cancelAnimationFrame(stressReqId);
        stressReqId = null;
      }
      if (btnStressLoopEl) {
        btnStressLoopEl.textContent = '[H] Stress';
        btnStressLoopEl.className = 'hud-control-btn px-2 py-0.5 rounded-full bg-slate-900/80 hover:bg-slate-800 text-gray-300 hover:text-white border border-white/15';
      }
      telemetryBadgeEl.textContent = (ws && ws.readyState === WebSocket.OPEN) ? 'LIVE 60Hz' : 'AGUARDANDO F1...';
      telemetryBadgeEl.className = 'px-2 py-0.5 rounded-full font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 shadow-sm';
    }

    function runStressFrame() {
      if (!isStressLoopActive) return;

      if (stressState === 'accel') {
        stressThr = 100;
        stressBrk = 0;
        stressRpm += 125 + (stressGear * 10);
        stressSpeed += 0.85 * (9 - stressGear);

        if (stressGear >= 7) stressOvt = true;

        if (stressRpm >= 13500) {
          if (stressGear < 8) {
            stressGear++;
            stressRpm = 9200;
          } else {
            stressState = 'braking';
          }
        }
      } else if (stressState === 'braking') {
        stressThr = 0;
        stressBrk = 100;
        stressOvt = false;
        stressSpeed -= 3.8;
        stressRpm -= 210;

        if (stressSpeed < 280 && stressGear === 8) { stressGear = 7; stressRpm = 11000; }
        else if (stressSpeed < 235 && stressGear === 7) { stressGear = 6; stressRpm = 11000; }
        else if (stressSpeed < 195 && stressGear === 6) { stressGear = 5; stressRpm = 11000; }
        else if (stressSpeed < 155 && stressGear === 5) { stressGear = 4; stressRpm = 11000; }
        else if (stressSpeed < 120 && stressGear === 4) { stressGear = 3; stressRpm = 11000; }
        else if (stressSpeed < 85 && stressGear === 3) { stressGear = 2; stressRpm = 10000; }
        else if (stressSpeed <= 65) {
          stressState = 'accel';
          stressGear = 2;
          stressRpm = 6500;
        }
      }

      applyTelemetryDirect({
        speed: Math.round(stressSpeed),
        gear: stressGear,
        engineRPM: Math.round(stressRpm),
        throttle: stressThr,
        brake: stressBrk,
        ersPercent: Math.max(10, 100 - (stressSpeed * 0.2)),
        overtake: stressOvt,
        drs: stressOvt ? 1 : 0
      });

      stressReqId = requestAnimationFrame(runStressFrame);
    }

    // HOTKEY 'H' LISTENER
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        toggleStressLoop();
      }
    });

    // PYWEBVIEW CONTROLS
    window.centerHud = function(e) {
      if (e) e.stopPropagation();
      if (window.pywebview && window.pywebview.api && window.pywebview.api.center_hud) {
        window.pywebview.api.center_hud();
      }
    };

    window.closeHud = function(e) {
      if (e) e.stopPropagation();
      if (window.pywebview && window.pywebview.api && window.pywebview.api.close_hud) {
        window.pywebview.api.close_hud();
      } else {
        window.close();
      }
    };

    connectWs();
  </script>
</body>

</html>
