<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>F1 24 Official Halo HUD Overlay</title>
  <!-- Fontes Oficiais Automotivas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Titillium+Web:ital,wght@0,700;0,900;1,700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Titillium Web', 'Chakra Petch', sans-serif;
    }

    .hud-wrapper {
      position: relative;
      width: 940px;
      height: 206px;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.85));
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .tabular-num {
      font-variant-numeric: tabular-nums;
    }

    /* Animação e transições suaves nos arcos */
    .telemetry-bar {
      transition: width 0.05s linear;
    }

    .speed-stroke {
      transition: stroke-dashoffset 0.05s linear;
    }
  </style>
</head>
<body>

<div class="hud-wrapper" id="hud-root">
  <svg viewBox="0 0 1000 220">
    <defs>
      <!-- Gradiente do Fundo da Carcaça Halo Oficial -->
      <linearGradient id="haloBase" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0f192b" stop-opacity="0.94" />
        <stop offset="60%" stop-color="#090f1a" stop-opacity="0.97" />
        <stop offset="100%" stop-color="#05080f" stop-opacity="0.99" />
      </linearGradient>

      <!-- Gradiente ERS Ciano/Azul -->
      <linearGradient id="ersFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#0077b6" />
      </linearGradient>

      <!-- Gradiente Tacômetro RPM Oficial -->
      <linearGradient id="rpmFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="65%" stop-color="#eab308" />
        <stop offset="88%" stop-color="#ef4444" />
        <stop offset="100%" stop-color="#d946ef" />
      </linearGradient>
    </defs>

    <!-- ==================== CARCAÇA EXTERIOR (HALO MOLD) ==================== -->
    <!-- Contorno único com a curvatura oficial do Halo: Asas abertas e domo abaulado -->
    <path d="M 60,182 
             L 370,146 
             C 390,72 610,72 630,146 
             L 940,182 
             L 915,62 
             C 770,52 630,52 500,52 
             C 370,52 230,52 85,62 
             Z" 
          fill="url(#haloBase)" 
          stroke="rgba(0, 229, 255, 0.35)" 
          stroke-width="1.8" 
          stroke-linejoin="round" />

    <!-- Aro Interno de destaque no Domo do Velocímetro -->
    <circle cx="500" cy="120" r="72" fill="#060b13" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />


    <!-- ==================== ASA ESQUERDA: ERS & TRAVÃO ==================== -->
    <!-- Rótulo ERS BATTERY e Percentual -->
    <text x="120" y="86" fill="#94a3b8" font-size="12" font-weight="800" letter-spacing="1.2">ERS BATTERY</text>
    <text id="ers-percent" x="350" y="86" text-anchor="end" fill="#ffffff" font-size="19" font-weight="900" font-family="'Chakra Petch'" class="tabular-num">99%</text>

    <!-- Barra de Bateria ERS -->
    <rect x="120" y="98" width="230" height="12" rx="3" fill="rgba(255, 255, 255, 0.08)" />
    <rect id="ers-bar" class="telemetry-bar" x="120" y="98" width="225" height="12" rx="3" fill="url(#ersFill)" />

    <!-- Barra de Freio (Brake) -->
    <text x="120" y="138" fill="#ef4444" font-size="11" font-weight="900" letter-spacing="1">BRAKE</text>
    <rect x="175" y="130" width="175" height="10" rx="3" fill="rgba(255, 255, 255, 0.08)" />
    <rect id="brake-bar" class="telemetry-bar" x="175" y="130" width="0" height="10" rx="3" fill="#ef4444" />

    <!-- Badge DRS -->
    <rect id="drs-box" x="120" y="152" width="56" height="18" rx="3" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    <text id="drs-text" x="148" y="161" text-anchor="middle" dominant-baseline="central" fill="#64748b" font-size="10" font-weight="900" letter-spacing="0.5">DRS</text>


    <!-- ==================== DOMO CENTRAL: VELOCÍMETRO ==================== -->
    <!-- Arco de Velocidade Dinâmico (Perímetro ~ 408) -->
    <circle cx="500" cy="120" r="65" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="6" />
    <circle id="speed-arc" class="speed-stroke" cx="500" cy="120" r="65" fill="none" stroke="#00f0ff" stroke-width="6"
            stroke-dasharray="408" stroke-dashoffset="120" stroke-linecap="round" transform="rotate(-90 500 120)" />

    <!-- Numerais Centrais Harmoniosos -->
    <text x="500" y="78" text-anchor="middle" dominant-baseline="central" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1">KM/H</text>
    <text id="speed-kmh" x="500" y="112" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="38" font-weight="900" font-family="'Chakra Petch'" class="tabular-num">187</text>
    <text id="speed-mph" x="500" y="144" text-anchor="middle" dominant-baseline="central" fill="#cbd5e1" font-size="17" font-weight="700" font-family="'Chakra Petch'" class="tabular-num">116</text>
    <text x="500" y="160" text-anchor="middle" dominant-baseline="central" fill="#64748b" font-size="9" font-weight="800" letter-spacing="0.5">MPH</text>


    <!-- ==================== ASA DIREITA: THROTTLE, MARCHAS & RPM ==================== -->
    <!-- Barra de Acelerador (Throttle) -->
    <text x="650" y="80" fill="#10b981" font-size="11" font-weight="900" letter-spacing="1">THROTTLE</text>
    <rect x="730" y="72" width="150" height="10" rx="3" fill="rgba(255, 255, 255, 0.08)" />
    <rect id="throttle-bar" class="telemetry-bar" x="730" y="72" width="110" height="10" rx="3" fill="#10b981" />

    <!-- Linha de Marchas com Espaçamento Amplo -->
    <text x="650" y="103" fill="#94a3b8" font-size="10" font-weight="800" letter-spacing="1">GEARS</text>
    <g id="gears-group" font-family="'Chakra Petch'" font-size="14" font-weight="800" fill="#64748b" dominant-baseline="central">
      <text x="654" y="120" id="gear-N">N</text>
      <text x="682" y="120" id="gear-1">1</text>
      <text x="710" y="120" id="gear-2">2</text>
      <text x="738" y="120" id="gear-3">3</text>
      <text x="766" y="120" id="gear-4">4</text>
      <text x="794" y="120" id="gear-5">5</text>
      <text x="822" y="120" id="gear-6" fill="#00f0ff" font-size="20" font-weight="900">6</text>
      <text x="850" y="120" id="gear-7">7</text>
      <text x="878" y="120" id="gear-8">8</text>
    </g>

    <!-- Tacômetro RPM e Alerta OVERTAKE Lado a Lado (100% Dentro da Asa) -->
    <text x="650" y="145" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.5">RPM x1000</text>
    
    <!-- Badge OVERTAKE interno -->
    <g id="overtake-badge" style="opacity: 0; transition: opacity 0.15s ease;">
      <rect x="798" y="136" width="82" height="15" rx="3" fill="#e11d48" />
      <text x="839" y="144" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="9" font-weight="900" letter-spacing="0.8">OVERTAKE</text>
    </g>

    <!-- Barra de Tacômetro RPM -->
    <rect x="650" y="155" width="230" height="12" rx="3" fill="rgba(255, 255, 255, 0.08)" />
    <rect id="rpm-bar" class="telemetry-bar" x="650" y="155" width="160" height="12" rx="3" fill="url(#rpmFill)" />
  </svg>
</div>

<script>
  // Handlers diretos da HUD para 60 FPS estáveis
  const elSpeedKmh = document.getElementById('speed-kmh');
  const elSpeedMph = document.getElementById('speed-mph');
  const elSpeedArc = document.getElementById('speed-arc');
  const elErsPercent = document.getElementById('ers-percent');
  const elErsBar = document.getElementById('ers-bar');
  const elBrakeBar = document.getElementById('brake-bar');
  const elThrottleBar = document.getElementById('throttle-bar');
  const elRpmBar = document.getElementById('rpm-bar');
  const elDrsBox = document.getElementById('drs-box');
  const elDrsText = document.getElementById('drs-text');
  const elOvertake = document.getElementById('overtake-badge');

  const gears = ['N', '1', '2', '3', '4', '5', '6', '7', '8'];

  function updateTelemetry(data) {
    if (!data) return;
    const payload = (data.type === 'telemetry' && data.data) ? data.data : data;

    // 1. Velocidade KM/H e MPH
    const kmh = Math.round(payload.speed || 0);
    const mph = Math.round(kmh * 0.621371);
    elSpeedKmh.textContent = kmh;
    elSpeedMph.textContent = mph;

    // Arco de Velocidade (Mapeado de 0 a 360 km/h num perímetro de 408)
    const arcFill = Math.min(kmh, 360) / 360;
    elSpeedArc.setAttribute('stroke-dashoffset', (408 - (arcFill * 270)).toFixed(1));

    // 2. Bateria ERS (Largura Máxima: 230px)
    let ers = 99;
    if (payload.ersPercent !== undefined) ers = payload.ersPercent;
    else if (payload.ers_store !== undefined) ers = payload.ers_store;
    else if (payload.ersStoreEnergy !== undefined) ers = (payload.ersStoreEnergy / 4000000) * 100;
    ers = Math.max(0, Math.min(100, ers));
    elErsPercent.textContent = `${Math.round(ers)}%`;
    elErsBar.setAttribute('width', ((ers / 100) * 230).toFixed(1));

    // 3. Freio (Largura Máxima: 175px) - normaliza 0.0-1.0 vs 0-100
    let brake = Number(payload.brake) || 0;
    if (brake > 1.0) brake = brake / 100.0;
    brake = Math.max(0, Math.min(1, brake));
    elBrakeBar.setAttribute('width', (brake * 175).toFixed(1));

    // 4. Acelerador (Largura Máxima: 150px) - normaliza 0.0-1.0 vs 0-100
    let throttle = Number(payload.throttle) || 0;
    if (throttle > 1.0) throttle = throttle / 100.0;
    throttle = Math.max(0, Math.min(1, throttle));
    elThrottleBar.setAttribute('width', (throttle * 150).toFixed(1));

    // 5. Marchas (Gears)
    const rawGear = payload.gear;
    const currentGear = (rawGear === 0 || rawGear === '0') ? 'N' : String(rawGear);
    gears.forEach(g => {
      const gNode = document.getElementById(`gear-${g}`);
      if (gNode) {
        const isActive = (g === currentGear);
        gNode.setAttribute('fill', isActive ? '#00f0ff' : '#64748b');
        gNode.setAttribute('font-size', isActive ? '20' : '14');
      }
    });

    // 6. Tacômetro RPM (Largura Máxima: 230px)
    const rpmMax = payload.maxRPM || payload.max_rpm || 15000;
    const rpmVal = payload.engineRPM !== undefined ? payload.engineRPM : (payload.engine_rpm || 0);
    const rpmNorm = Math.max(0, Math.min(1, rpmVal / rpmMax));
    elRpmBar.setAttribute('width', (rpmNorm * 230).toFixed(1));

    // 7. DRS e Overtake
    const isDrs = Boolean(payload.drs || payload.drsAllowed);
    if (isDrs) {
      elDrsBox.setAttribute('fill', '#10b981');
      elDrsBox.setAttribute('stroke', '#34d399');
      elDrsText.setAttribute('fill', '#ffffff');
    } else {
      elDrsBox.setAttribute('fill', 'rgba(255, 255, 255, 0.06)');
      elDrsBox.setAttribute('stroke', 'rgba(255, 255, 255, 0.18)');
      elDrsText.setAttribute('fill', '#64748b');
    }

    const isOvt = Boolean(payload.ersDeployMode > 0 || payload.overtake || payload.overtakeActive);
    elOvertake.style.opacity = isOvt ? '1' : '0';
  }

  // Conexão WebSocket de Produção com Reconnect
  function connectWS() {
    const wsUrl = `ws://${window.location.hostname || '127.0.0.1'}:8000/ws/telemetry`;
    const socket = new WebSocket(wsUrl);

    socket.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data);
        updateTelemetry(payload);
      } catch (err) {}
    };

    socket.onclose = () => {
      setTimeout(connectWS, 1000);
    };
  }

  window.addEventListener('DOMContentLoaded', connectWS);
</script>

</body>
</html>
