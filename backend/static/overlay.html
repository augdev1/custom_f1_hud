<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 24 Live HUD Overlay</title>
  <!-- Google Fonts: Rajdhani & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800;900&family=Rajdhani:wght@600;700;800;900&family=Titillium+Web:wght@600;700;900&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --accent-color: #00D2BE;
      --accent-glow: rgba(0, 210, 190, 0.45);
      --halo-rail: #00D2BE;
    }

    * {
      box-sizing: border-box;
    }

    /* True 32-bit Transparent Canvas with Glassmorphism Base */
    html,
    body {
      background-color: transparent !important;
      background: transparent !important;
      margin: 0 !important;
      padding: 3px !important;
      border: none !important;
      outline: none !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Rajdhani', system-ui, sans-serif;
    }

    /* Win32 Native Drag Region */
    .pywebview-drag-region {
      -webkit-app-region: drag;
      cursor: grab;
    }

    .pywebview-drag-region:active {
      cursor: grabbing;
    }

    /* AUTHENTIC AERODYNAMIC HALO CHASSIS - Modern Frosted Glassmorphism */
    .halo-chassis {
      background: linear-gradient(135deg, rgba(14, 20, 34, 0.72) 0%, rgba(7, 10, 18, 0.82) 100%) !important;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-radius: 14px !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      outline: none !important;
      box-shadow:
        0 14px 34px -8px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.60) !important;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    /* CENTER SPEEDOMETER POD - Precision High-Tech Racing Dial (Frosted Glass) */
    .halo-speed-pod {
      background: radial-gradient(circle at 45% 35%, rgba(26, 38, 60, 0.68) 0%, rgba(8, 12, 22, 0.84) 100%) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
      box-shadow:
        0 0 22px var(--accent-glow, rgba(0, 210, 190, 0.35)),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        inset 0 0 18px rgba(0, 0, 0, 0.85) !important;
      border-radius: 50%;
      width: 114px;
      height: 114px;
      position: relative;
    }

    /* RPM Circular Arc */
    .rpm-arc-svg {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 126px;
      height: 126px;
      pointer-events: none;
      transform: rotate(-90deg);
    }

    .rpm-arc-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 4.5;
    }

    .rpm-arc-meter {
      fill: none;
      stroke: var(--accent-color, #00D2BE);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 360;
      stroke-dashoffset: 360;
      transition: stroke-dashoffset 0.04s linear, stroke 0.12s ease;
      filter: drop-shadow(0 0 6px var(--accent-color, #00D2BE));
    }

    .rpm-arc-redline {
      stroke: #FF1744 !important;
      filter: drop-shadow(0 0 10px #FF1744) !important;
    }

    /* SHIFT ALERT FLASH OVERLAY ON CUTOFF */
    @keyframes shiftFlashAnim {

      0%,
      100% {
        opacity: 0;
      }

      50% {
        opacity: 0.85;
      }
    }

    .shift-alert-flash {
      animation: shiftFlashAnim 0.09s infinite ease-in-out;
      background: radial-gradient(circle, rgba(155, 81, 224, 0.5) 0%, transparent 75%) !important;
    }

    /* VERTICAL SEGMENTED PEDAL GAUGES (Frosted Glass Container) */
    .pedal-meter-container {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      width: 22px;
      height: 80px;
      background: rgba(10, 15, 25, 0.60);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 2px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 12px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .pedal-seg {
      width: 100%;
      height: 3.5px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.08);
      transition: background-color 0.03s ease, box-shadow 0.03s ease;
    }

    .pedal-seg.active-thr {
      background: #00E676 !important;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.95) !important;
    }

    .pedal-seg.active-brk {
      background: #FF1744 !important;
      box-shadow: 0 0 8px rgba(255, 23, 68, 0.95) !important;
    }

    /* Peak Hold Marker line */
    .pedal-peak-marker {
      position: absolute;
      left: 1px;
      right: 1px;
      height: 2px;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
      pointer-events: none;
      transition: bottom 0.08s ease-out;
      bottom: 0px;
      border-radius: 1px;
    }

    /* GEAR STRIP (R N 1 2 3 4 5 6 7 8) */
    .gear-item {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.35);
      font-size: 10.5px;
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: all 0.08s ease;
    }

    .gear-item.active {
      color: #000000 !important;
      background-color: var(--accent-color, #00D2BE) !important;
      box-shadow: 0 0 14px var(--accent-color, #00D2BE) !important;
      font-weight: 900 !important;
      transform: scale(1.15);
    }

    .gear-item.active-reverse {
      color: #ffffff !important;
      background-color: #ef4444 !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.95) !important;
      font-weight: 900 !important;
      transform: scale(1.15);
    }

    /* 16-LED SHIFT LIGHT BAR (Racing Wheel Formula Spec) */
    .led-shift {
      flex: 1;
      height: 6.5px;
      border-radius: 1px;
      background-color: rgba(255, 255, 255, 0.08);
      transition: none;
    }

    .led-shift.active-green {
      background-color: #00E676;
      box-shadow: 0 0 9px #00E676, inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .led-shift.active-red {
      background-color: #FF1744;
      box-shadow: 0 0 9px #FF1744, inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .led-shift.active-purple {
      background-color: #9B51E0;
      box-shadow: 0 0 11px #9B51E0, inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    .led-shift.active-blue {
      background-color: #00B0FF;
      box-shadow: 0 0 11px #00B0FF, inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    /* STEERING GAUGE BAR */
    .steer-bar-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      border-radius: 2px;
      overflow: hidden;
    }

    .steer-bar-center {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      margin-left: -1px;
      background: rgba(255, 255, 255, 0.35);
    }

    .steer-bar-thumb {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--accent-color, #00D2BE);
      box-shadow: 0 0 6px var(--accent-color, #00D2BE);
      border-radius: 1px;
      transition: left 0.03s linear, width 0.03s linear;
    }

    /* FROSTED GLASS SURFACE STYLING */
    .wing-block {
      background: rgba(14, 20, 32, 0.55) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.09) !important;
      border-radius: 8px;
      padding: 5px 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .glass-surface {
      background: rgba(10, 14, 24, 0.55) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.15s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.15) !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
    }

    /* MINIMAL TOP CONTROL HEADER */
    #topControlBar {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    body.is-locked #topControlBar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
    }

    body.is-locked:hover #topControlBar {
      opacity: 0.85;
      pointer-events: auto;
      transform: translateY(0);
    }
  </style>
</head>

<body class="w-full h-full p-1 select-none flex flex-col justify-center items-center overflow-hidden">

  <!-- UNIFIED F1 REALISTIC HALO COCKPIT HUD -->
  <div id="hudRoot" class="halo-chassis w-full h-full p-2 flex flex-col justify-between relative select-none">

    <!-- 0. SLIM TOP BAR: Drag Handle, Telemetry Status & Controls -->
    <div id="topControlBar" class="w-full h-5 px-2 flex items-center justify-between text-xs font-mono select-none">
      <!-- Drag Region & Status -->
      <div class="pywebview-drag-region flex items-center gap-2 cursor-grab flex-1 h-full">
        <i data-lucide="grip-horizontal" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span class="font-bold tracking-widest uppercase text-[9px] text-gray-300">F1 HALO COCKPIT</span>
        <div id="statusPill"
          class="flex items-center gap-1 px-1.5 py-0.2 rounded-md glass-surface text-[8px]">
          <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse"></span>
          <span id="statusLabel" class="text-gray-300 uppercase">Aguardando F1 24...</span>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-1">
        <button id="btnThemeToggle" onclick="toggleThemeMenu(event)"
          class="glass-btn px-2 py-0.5 rounded-md text-cyan-300 text-[8.5px] font-semibold flex items-center gap-1 transition active:scale-95">
          <i data-lucide="palette" class="w-2.5 h-2.5 text-cyan-400"></i> Cores
        </button>
        <button id="btnResetPos" onclick="centerHud(event)"
          class="glass-btn px-2 py-0.5 rounded-md text-gray-300 text-[8.5px] font-semibold transition active:scale-95"
          title="Centralizar na tela">
          Centralizar
        </button>
        <button id="btnLockPos" onclick="toggleLock(event)"
          class="px-2 py-0.5 rounded-md bg-cyan-400/90 hover:bg-cyan-300 text-black font-extrabold text-[8.5px] flex items-center gap-1 shadow-md transition active:scale-95">
          <i data-lucide="lock" class="w-2.5 h-2.5"></i> <span id="lockBtnText">TRAVAR (F8)</span>
        </button>
      </div>
    </div>

    <!-- 0.1 Team Color Palette Modal (Dropdown) -->
    <div id="themeMenu"
      class="hidden absolute top-7 left-3 right-3 p-2.5 rounded-xl bg-slate-950/85 backdrop-blur-2xl border border-white/15 shadow-2xl font-mono text-[10px] z-50 flex flex-col gap-2">
      <div class="flex items-center justify-between border-b border-white/10 pb-1">
        <span class="font-bold uppercase tracking-wider text-white flex items-center gap-1.5">
          <i data-lucide="palette" class="w-3.5 h-3.5 text-cyan-400"></i> Temas Oficiais F1
        </span>
        <div class="flex items-center gap-2">
          <button onclick="toggleMockSimulator(event)" id="btnSimToggle"
            class="px-2 py-0.5 rounded bg-green-500/20 hover:bg-green-500/40 text-green-300 border border-green-500/40 flex items-center gap-1 font-bold transition">
            <i data-lucide="play" class="w-3 h-3 text-green-400"></i> <span id="simBtnText">Testar Giro</span>
          </button>
          <button onclick="toggleThemeMenu(event)"
            class="text-gray-400 hover:text-white text-sm px-1 font-bold leading-none">&times;</button>
        </div>
      </div>

      <div class="grid grid-cols-6 gap-1.5">
        <button onclick="selectTheme('aston')"
          class="px-1.5 py-1 rounded bg-white/5 hover:bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 font-bold transition flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#00E676]"></span> Aston
        </button>
        <button onclick="selectTheme('mercedes')"
          class="px-1.5 py-1 rounded bg-white/5 hover:bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 font-bold transition flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#00D2BE]"></span> Mercedes
        </button>
        <button onclick="selectTheme('ferrari')"
          class="px-1.5 py-1 rounded bg-white/5 hover:bg-red-500/20 border border-red-500/40 text-red-400 font-bold transition flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#E10600]"></span> Ferrari
        </button>
        <button onclick="selectTheme('mclaren')"
          class="px-1.5 py-1 rounded bg-white/5 hover:bg-orange-500/20 border border-orange-500/40 text-orange-400 font-bold transition flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#FF8000]"></span> McLaren
        </button>
        <button onclick="selectTheme('redbull')"
          class="px-1.5 py-1 rounded bg-white/5 hover:bg-yellow-500/20 border border-yellow-400/40 text-yellow-300 font-bold transition flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#FFD100]"></span> Red Bull
        </button>
        <button onclick="selectTheme('cyberpunk')"
          class="px-1.5 py-1 rounded bg-white/5 hover:bg-purple-500/20 border border-purple-400/40 text-purple-300 font-bold transition flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#9B51E0]"></span> Neon
        </button>
      </div>

      <div class="flex items-center justify-between pt-1 border-t border-white/10 text-[9px] text-gray-300">
        <span>Cor Customizada:</span>
        <div class="flex items-center gap-2">
          <input type="color" id="customColorPicker" value="#00d2be" oninput="setCustomAccent(this.value)"
            class="w-6 h-5 rounded cursor-pointer bg-transparent border-0">
          <span id="customColorCode" class="text-cyan-400 font-mono">#00D2BE</span>
        </div>
      </div>
    </div>

    <!-- 1. MAIN TELEMETRY ARCH (Exact 1:1 F1 Halo HUD Geometry) -->
    <div class="w-full flex-1 flex items-center justify-between px-1 my-0.5 min-h-0 relative">

      <!-- LEFT WING: DRS, ERS & BRAKE SEGMENTS -->
      <div class="flex-1 flex items-center justify-end gap-2.5 pr-1.5">

        <!-- Left Wing Sub-panel: DRS, ERS Battery & Deploy Mode (Frosted Aero Wing Block) -->
        <div class="wing-block flex flex-col gap-1.5 justify-center min-w-[108px]">
          <!-- ERS Battery Charge Bar + Mode Indicator -->
          <div class="flex flex-col gap-0.5">
            <div class="flex items-center justify-between text-[8px] font-mono font-bold text-gray-400">
              <span class="flex items-center gap-1">
                <span>ERS</span>
                <span id="ersModeBadge"
                  class="text-[7.5px] px-1 py-0.2 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-extrabold uppercase">MED</span>
              </span>
              <span id="ersPctText" class="text-emerald-400">100%</span>
            </div>
            <div class="w-full h-2 glass-surface rounded-sm overflow-hidden p-0.5">
              <div id="ersBar"
                class="h-full rounded-sm bg-gradient-to-r from-emerald-400 via-cyan-400 to-blue-500 transition-none"
                style="width: 100%;"></div>
            </div>
          </div>

          <!-- DRS Pill Badge (Angled Motorsport Pill with Status Indicator) -->
          <div id="drsBadge"
            class="flex items-center justify-center gap-1.5 px-2.5 py-1 rounded-md glass-surface text-[9.5px] font-mono font-bold text-gray-400 transition-all">
            <i data-lucide="wind" class="w-3 h-3"></i>
            <span id="drsText">DRS</span>
          </div>
        </div>

        <!-- Vertical BRAKE Meter (Segmented LEDs + Peak Hold) -->
        <div class="flex flex-col items-center gap-1">
          <div class="pedal-meter-container" id="brakeMeter">
            <div class="pedal-peak-marker" id="brakePeakMarker"></div>
            <!-- 16 LED segments generated via JS -->
          </div>
          <span class="text-[7.5px] font-mono font-black text-red-400 tracking-wider">BRAKE</span>
        </div>

      </div>

      <!-- CENTER POD: PRECISION HIGH-TECH RACING SPEEDOMETER & CIRCULAR RPM TACHOMETER -->
      <div class="flex flex-col items-center justify-center flex-shrink-0 mx-1.5 z-10">
        <div class="halo-speed-pod flex flex-col items-center justify-center relative overflow-hidden"
          id="centerPodContainer">

          <!-- SVG Circular RPM Arc with Crisp Vector Gauge -->
          <svg class="rpm-arc-svg" viewBox="0 0 126 126">
            <circle class="rpm-arc-bg" cx="63" cy="63" r="54"></circle>
            <circle id="rpmArcMeter" class="rpm-arc-meter" cx="63" cy="63" r="54"></circle>
          </svg>

          <!-- Label: SPEED + Top Speed Indicator -->
          <div
            class="flex items-center gap-1 -mt-1 text-[7.5px] font-mono font-bold text-gray-400 tracking-widest uppercase">
            <span>SPEED</span>
            <span id="topSpeedText" class="text-cyan-400/80 text-[7px] font-semibold">MAX 0</span>
          </div>

          <!-- Big Bold Speed Value (High Contrast Tabular Figures) -->
          <span id="speedVal"
            class="text-4xl font-black font-display text-white tracking-tighter leading-none drop-shadow-[0_0_12px_rgba(255,255,255,0.45)]">
            0
          </span>

          <!-- Center Pod Gear Indicator (Crisp Motorsport Monospace) -->
          <div class="flex items-center justify-center mt-0.5">
            <span id="gearInPod" class="text-[12.5px] font-black font-mono text-yellow-400">N</span>
          </div>

        </div>
      </div>

      <!-- RIGHT WING: THROTTLE SEGMENTS, STEERING ANGLE, GEAR STRIP & RPM / SHIFT LIGHTS -->
      <div class="flex-1 flex items-center justify-start gap-2.5 pl-1.5">

        <!-- Vertical THROTTLE Meter (Segmented LEDs + Peak Hold) -->
        <div class="flex flex-col items-center gap-1">
          <div class="pedal-meter-container" id="throttleMeter">
            <div class="pedal-peak-marker" id="throttlePeakMarker"></div>
            <!-- 16 LED segments generated via JS -->
          </div>
          <span class="text-[7.5px] font-mono font-black text-green-400 tracking-wider">THROTTLE</span>
        </div>

        <!-- Gear Sequence Strip (R N 1 2 3 4 5 6 7 8), 16-LED Bar & Steering Angle (Frosted Aero Wing Block) -->
        <div class="wing-block flex flex-col gap-1.5 justify-center">

          <!-- 16-LED Shift Light Bar (High-Visibility Formula Standard) -->
          <div class="w-full flex gap-1 p-1 glass-surface rounded" id="ledsContainer">
            <!-- 16 LEDs dynamically injected -->
          </div>

          <!-- Gear Header, Strip & Steer Bar -->
          <div class="flex flex-col gap-1">
            <div class="flex items-center justify-between text-[8px] font-mono text-gray-400 font-bold uppercase">
              <span>GEAR</span>
              <span id="rpmNumText" class="text-white font-mono tracking-tight font-extrabold">0 RPM</span>
            </div>
            <div class="flex items-center gap-[2.5px] p-0.5 rounded glass-surface" id="gearStrip">
              <span id="gR" class="gear-item">R</span>
              <span id="gN" class="gear-item active">N</span>
              <span id="g1" class="gear-item">1</span>
              <span id="g2" class="gear-item">2</span>
              <span id="g3" class="gear-item">3</span>
              <span id="g4" class="gear-item">4</span>
              <span id="g5" class="gear-item">5</span>
              <span id="g6" class="gear-item">6</span>
              <span id="g7" class="gear-item">7</span>
              <span id="g8" class="gear-item">8</span>
            </div>

            <!-- Steering Angle Indicator Track -->
            <div class="flex items-center gap-1 pt-0.5">
              <span class="text-[7px] font-mono text-gray-400 font-bold">STEER</span>
              <div class="steer-bar-track flex-1" id="steerTrack">
                <div class="steer-bar-center"></div>
                <div class="steer-bar-thumb" id="steerThumb" style="left: 50%; width: 0%;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 4-Corner Tyres & Brakes Thermal Telemetry (With Brakes + Tyres Integrated) -->
        <div class="wing-block flex flex-col gap-1 text-[8px] font-mono min-w-[100px] flex-shrink-0">
          <div class="flex justify-between items-center text-gray-400 border-b border-white/10 pb-0.5">
            <span class="font-bold tracking-wider">TYRES / BRK</span>
            <span class="text-cyan-400">°C</span>
          </div>
          <div class="grid grid-cols-2 gap-x-2.5 gap-y-1 whitespace-nowrap">
            <div class="flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-gray-500 font-bold text-[7.5px]">FL</span>
                <span id="tyreFL" class="text-cyan-400 font-bold">90°</span>
              </div>
              <div class="flex items-center justify-between text-[7px] text-gray-400">
                <span class="text-gray-600">B</span>
                <span id="brakeFL" class="text-gray-300">350°</span>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-gray-500 font-bold text-[7.5px]">FR</span>
                <span id="tyreFR" class="text-cyan-400 font-bold">90°</span>
              </div>
              <div class="flex items-center justify-between text-[7px] text-gray-400">
                <span class="text-gray-600">B</span>
                <span id="brakeFR" class="text-gray-300">350°</span>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-gray-500 font-bold text-[7.5px]">RL</span>
                <span id="tyreRL" class="text-cyan-400 font-bold">90°</span>
              </div>
              <div class="flex items-center justify-between text-[7px] text-gray-400">
                <span class="text-gray-600">B</span>
                <span id="brakeRL" class="text-gray-300">350°</span>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-gray-500 font-bold text-[7.5px]">RR</span>
                <span id="tyreRR" class="text-cyan-400 font-bold">90°</span>
              </div>
              <div class="flex items-center justify-between text-[7px] text-gray-400">
                <span class="text-gray-600">B</span>
                <span id="brakeRR" class="text-gray-300">350°</span>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- 2. FOOTER: Watermark (Bottom-Left) & Broadcast Status (Bottom-Right) -->
    <div class="w-full flex items-center justify-between px-2 text-[9px] font-mono text-gray-400 select-none">
      <!-- Watermark: made by augrocky™ -->
      <div id="augrockyTrademark" class="flex items-center gap-1">
        <span class="tracking-wider uppercase font-medium">made by <span
            class="font-bold text-gray-200">augrocky</span><span id="trademarkSymbol"
            class="text-white font-bold text-[9px] ml-0.5">™</span></span>
      </div>

      <!-- Telemetry Info -->
      <div class="flex items-center gap-2 text-[8px] text-gray-500 uppercase tracking-widest">
        <span>F1 REALISTIC HALO</span>
        <span>•</span>
        <span id="fpsIndicator" class="text-cyan-400 font-bold">60 FPS</span>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // Generate 16 Pedal Segments for Brake & Throttle
    const TOTAL_SEGMENTS = 16;
    const brakeMeter = document.getElementById('brakeMeter');
    const throttleMeter = document.getElementById('throttleMeter');
    const brakeSegments = [];
    const throttleSegments = [];

    for (let i = 0; i < TOTAL_SEGMENTS; i++) {
      const bSeg = document.createElement('div');
      bSeg.className = 'pedal-seg';
      brakeMeter.appendChild(bSeg);
      brakeSegments.push(bSeg);

      const tSeg = document.createElement('div');
      tSeg.className = 'pedal-seg';
      throttleMeter.appendChild(tSeg);
      throttleSegments.push(tSeg);
    }

    // Generate 16 LEDs for Shift Light Bar (5 Green, 5 Red, 3 Purple, 3 Blue)
    const ledsContainer = document.getElementById('ledsContainer');
    const TOTAL_LEDS = 16;
    const leds = [];
    for (let i = 0; i < TOTAL_LEDS; i++) {
      const led = document.createElement('div');
      led.className = 'led-shift';
      ledsContainer.appendChild(led);
      leds.push(led);
    }

    // DOM Elements
    const hudRoot = document.getElementById('hudRoot');
    const centerPodContainer = document.getElementById('centerPodContainer');
    const speedVal = document.getElementById('speedVal');
    const topSpeedText = document.getElementById('topSpeedText');
    const gearInPod = document.getElementById('gearInPod');
    const rpmArcMeter = document.getElementById('rpmArcMeter');
    const rpmNumText = document.getElementById('rpmNumText');
    const ersBar = document.getElementById('ersBar');
    const ersPctText = document.getElementById('ersPctText');
    const ersModeBadge = document.getElementById('ersModeBadge');
    const drsBadge = document.getElementById('drsBadge');
    const drsText = document.getElementById('drsText');
    const themeMenu = document.getElementById('themeMenu');
    const trademarkSymbol = document.getElementById('trademarkSymbol');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const lockBtnText = document.getElementById('lockBtnText');
    const steerThumb = document.getElementById('steerThumb');
    const brakePeakMarker = document.getElementById('brakePeakMarker');
    const throttlePeakMarker = document.getElementById('throttlePeakMarker');
    const tyreFL = document.getElementById('tyreFL');
    const tyreFR = document.getElementById('tyreFR');
    const tyreRL = document.getElementById('tyreRL');
    const tyreRR = document.getElementById('tyreRR');
    const brakeFL = document.getElementById('brakeFL');
    const brakeFR = document.getElementById('brakeFR');
    const brakeRL = document.getElementById('brakeRL');
    const brakeRR = document.getElementById('brakeRR');

    // Peak Hold tracking
    let brakePeak = 0;
    let throttlePeak = 0;
    let maxSpeedRecord = 0;

    // Gear sequence list
    const gearIds = ['gR', 'gN', 'g1', 'g2', 'g3', 'g4', 'g5', 'g6', 'g7', 'g8'];

    function updateGear(gear) {
      gearIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = 'gear-item';
      });

      let targetId = 'gN';
      let charStr = 'N';
      const gNum = Number(gear);

      if (gear === -1 || gear === '-1' || gear === 'R' || gear === 'r' || gNum === -1) {
        targetId = 'gR';
        charStr = 'R';
      } else if (gNum >= 1 && gNum <= 8) {
        targetId = `g${gNum}`;
        charStr = `${gNum}`;
      } else {
        targetId = 'gN';
        charStr = 'N';
      }

      const activeEl = document.getElementById(targetId);
      if (activeEl) {
        if (targetId === 'gR') {
          activeEl.className = 'gear-item active active-reverse';
        } else {
          activeEl.className = 'gear-item active';
        }
      }
      if (gearInPod) {
        gearInPod.textContent = charStr;
        gearInPod.className = charStr === 'R' ? 'text-[12.5px] font-black font-mono text-red-400' :
          charStr === 'N' ? 'text-[12.5px] font-black font-mono text-yellow-400' :
            'text-[12.5px] font-black font-mono text-cyan-300';
      }
    }

    // Update Pedals (Brake & Throttle Segments + Peak Hold decay)
    function updatePedals(throttlePct, brakePct) {
      let tPct = Number(throttlePct) || 0;
      if (tPct > 0 && tPct <= 1.0) tPct = tPct * 100.0;
      let bPct = Number(brakePct) || 0;
      if (bPct > 0 && bPct <= 1.0) bPct = bPct * 100.0;

      // Peak Hold with smooth decay
      if (bPct >= brakePeak) {
        brakePeak = bPct;
      } else {
        brakePeak = Math.max(0, brakePeak - 1.2);
      }
      if (tPct >= throttlePeak) {
        throttlePeak = tPct;
      } else {
        throttlePeak = Math.max(0, throttlePeak - 1.5);
      }

      if (brakePeakMarker) {
        brakePeakMarker.style.bottom = `${Math.min(76, (brakePeak / 100) * 76)}px`;
        brakePeakMarker.style.opacity = brakePeak > 2 ? '0.9' : '0';
      }
      if (throttlePeakMarker) {
        throttlePeakMarker.style.bottom = `${Math.min(76, (throttlePeak / 100) * 76)}px`;
        throttlePeakMarker.style.opacity = throttlePeak > 2 ? '0.9' : '0';
      }

      const activeThrCount = Math.round((Math.min(100, Math.max(0, tPct)) / 100) * TOTAL_SEGMENTS);
      for (let i = 0; i < TOTAL_SEGMENTS; i++) {
        if (throttleSegments[i]) {
          throttleSegments[i].className = i < activeThrCount ? 'pedal-seg active-thr' : 'pedal-seg';
        }
      }

      const activeBrkCount = Math.round((Math.min(100, Math.max(0, bPct)) / 100) * TOTAL_SEGMENTS);
      for (let i = 0; i < TOTAL_SEGMENTS; i++) {
        if (brakeSegments[i]) {
          brakeSegments[i].className = i < activeBrkCount ? 'pedal-seg active-brk' : 'pedal-seg';
        }
      }
    }

    // Update RPM (Circular Arc & 16-LED Formula Shift Light Bar + Cutoff Flash)
    const ARC_CIRCUMFERENCE = 339.29; // 2 * PI * 54
    function updateRpm(rpm, maxRpm) {
      if (rpmNumText) rpmNumText.textContent = `${rpm} RPM`;
      const pct = Math.max(0, Math.min(1, rpm / (maxRpm || 13500)));

      // Circular RPM Arc offset
      if (rpmArcMeter) {
        const offset = ARC_CIRCUMFERENCE * (1 - pct);
        rpmArcMeter.style.strokeDashoffset = offset;
        if (pct > 0.88) {
          rpmArcMeter.classList.add('rpm-arc-redline');
        } else {
          rpmArcMeter.classList.remove('rpm-arc-redline');
        }
      }

      // Cutoff Flash Alert at 96%+ RPM
      if (centerPodContainer) {
        if (pct >= 0.96) {
          centerPodContainer.classList.add('shift-alert-flash');
        } else {
          centerPodContainer.classList.remove('shift-alert-flash');
        }
      }

      // 16-LED Shift Lights: 5 Green, 5 Red, 3 Purple, 3 Blue
      const activeLeds = Math.floor(pct * TOTAL_LEDS);
      for (let i = 0; i < TOTAL_LEDS; i++) {
        if (leds[i]) {
          if (i < activeLeds) {
            if (i < 5) leds[i].className = 'led-shift active-green';
            else if (i < 10) leds[i].className = 'led-shift active-red';
            else if (i < 13) leds[i].className = 'led-shift active-purple';
            else leds[i].className = 'led-shift active-blue';
          } else {
            leds[i].className = 'led-shift';
          }
        }
      }
    }

    // Update Steering Gauge Bar (-1.0 left to +1.0 right)
    function updateSteer(steerVal) {
      if (!steerThumb) return;
      const cleanSteer = Math.max(-1.0, Math.min(1.0, Number(steerVal) || 0));
      if (Math.abs(cleanSteer) < 0.02) {
        steerThumb.style.width = '0%';
        steerThumb.style.left = '50%';
      } else if (cleanSteer > 0) {
        const wPct = cleanSteer * 50;
        steerThumb.style.left = '50%';
        steerThumb.style.width = `${wPct}%`;
      } else {
        const wPct = Math.abs(cleanSteer) * 50;
        steerThumb.style.left = `${50 - wPct}%`;
        steerThumb.style.width = `${wPct}%`;
      }
    }

    // Update DRS Badge
    function updateDrs(drsStatus) {
      if (!drsBadge || !drsText) return;
      if (drsStatus === 1) { // Active
        drsBadge.className = 'flex items-center justify-center gap-1.5 px-2.5 py-1 rounded bg-emerald-500 text-black font-black font-mono text-[9.5px] shadow-[0_0_14px_rgba(0,230,118,0.8)]';
        drsText.textContent = 'DRS ON';
      } else if (drsStatus === 2) { // Available
        drsBadge.className = 'flex items-center justify-center gap-1.5 px-2.5 py-1 rounded bg-yellow-400 text-black font-bold font-mono text-[9.5px] shadow-[0_0_12px_rgba(250,204,21,0.7)]';
        drsText.textContent = 'DRS AVAIL';
      } else { // Closed / Inactive
        drsBadge.className = 'flex items-center justify-center gap-1.5 px-2.5 py-1 rounded bg-white/5 border border-white/10 text-[9.5px] font-mono font-bold text-gray-400';
        drsText.textContent = 'DRS';
      }
    }

    // Update ERS Battery & Deploy Mode
    const ERS_MODES = ['OFF', 'MED', 'HOTLAP', 'OVERTAKE'];
    function updateErs(pct, mode) {
      const cleanPct = Math.max(0, Math.min(100, pct));
      if (ersBar) ersBar.style.width = `${cleanPct}%`;
      if (ersPctText) ersPctText.textContent = `${Math.round(cleanPct)}%`;
      if (ersModeBadge) {
        const modeLabel = ERS_MODES[mode] || 'MED';
        ersModeBadge.textContent = modeLabel;
        if (mode === 3) {
          ersModeBadge.className = 'text-[7.5px] px-1 py-0.2 rounded bg-purple-500/30 text-purple-300 border border-purple-500/50 font-extrabold uppercase animate-pulse';
        } else if (mode === 2) {
          ersModeBadge.className = 'text-[7.5px] px-1 py-0.2 rounded bg-red-500/25 text-red-300 border border-red-500/40 font-extrabold uppercase';
        } else {
          ersModeBadge.className = 'text-[7.5px] px-1 py-0.2 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-extrabold uppercase';
        }
      }
    }

    // Update Tyre & Brake Thermal Readings
    function formatTyreTemp(el, temp) {
      if (!el) return;
      el.textContent = `${temp}°`;
      if (temp < 85) el.className = 'text-cyan-400 font-bold';
      else if (temp <= 108) el.className = 'text-green-400 font-bold';
      else el.className = 'text-red-400 font-bold';
    }

    function formatBrakeTemp(el, temp) {
      if (!el) return;
      el.textContent = `${temp}°`;
      if (temp > 650) el.className = 'text-red-400 font-bold';
      else if (temp > 450) el.className = 'text-yellow-300 font-medium';
      else el.className = 'text-gray-400';
    }

    function updateThermal(tyres, brakes) {
      if (tyres && tyres.length >= 4) {
        formatTyreTemp(tyreFL, tyres[0]);
        formatTyreTemp(tyreFR, tyres[1]);
        formatTyreTemp(tyreRL, tyres[2]);
        formatTyreTemp(tyreRR, tyres[3]);
      }
      if (brakes && brakes.length >= 4) {
        formatBrakeTemp(brakeFL, brakes[0]);
        formatBrakeTemp(brakeFR, brakes[1]);
        formatBrakeTemp(brakeRL, brakes[2]);
        formatBrakeTemp(brakeRR, brakes[3]);
      }
    }

    // RENDER LIVE FRAME (Handles both raw server frames and nested schemas)
    function renderTelemetry(data) {
      if (!data) return;

      // 1. Speed (KM/H) & Top Speed Peak Record
      const currentSpeed = Math.round(data.speed || 0);
      if (speedVal) speedVal.textContent = currentSpeed;
      if (currentSpeed > maxSpeedRecord) {
        maxSpeedRecord = currentSpeed;
        if (topSpeedText) topSpeedText.textContent = `MAX ${maxSpeedRecord}`;
      }

      // 2. Gear
      updateGear(data.gear !== undefined ? data.gear : 0);

      // 3. Pedals (Auto-normalizes float 0.0-1.0 to 0-100) + Peak Hold
      updatePedals(data.throttle || 0, data.brake || 0);

      // 4. Engine RPM (Supports engineRPM or engine_rpm) + Shift Cutoff Alert
      const rpm = data.engineRPM !== undefined ? data.engineRPM : (data.engine_rpm || 0);
      const maxRpm = data.maxRPM !== undefined ? data.maxRPM : (data.max_rpm || 13500);
      updateRpm(rpm, maxRpm);

      // 5. Steering Angle (-1.0 to 1.0)
      if (data.steer !== undefined) {
        updateSteer(data.steer);
      }

      // 6. DRS (1 = Active, 2 = Available)
      const drsState = data.drs === 1 ? 1 : (data.drsAllowed === 1 ? 2 : (data.drs || 0));
      updateDrs(drsState);

      // 7. ERS Battery & Deploy Mode (Supports Joules or 0-100%)
      let ersPct = 100;
      if (data.ersStoreEnergy !== undefined) {
        ersPct = Math.min(100, Math.max(0, (data.ersStoreEnergy / 4000000) * 100));
      } else if (data.ers_store !== undefined) {
        ersPct = data.ers_store;
      }
      const ersMode = data.ersDeployMode !== undefined ? data.ersDeployMode : (data.ers_deploy_mode || 1);
      updateErs(ersPct, ersMode);

      // 8. Tyres & Brakes Thermal Readings
      const rawTyres = data.tyresSurfaceTemperature || data.tyre_surface_temp;
      const rawBrakes = data.brakesTemperature || data.brake_temperature;
      let orderedTyres = null;
      let orderedBrakes = null;

      if (rawTyres && rawTyres.length >= 4) {
        if (data.tyresSurfaceTemperature) {
          // Official F1 24 array order: 0=RL, 1=RR, 2=FL, 3=FR -> Map to [FL, FR, RL, RR]
          orderedTyres = [
            Math.round(rawTyres[2]),
            Math.round(rawTyres[3]),
            Math.round(rawTyres[0]),
            Math.round(rawTyres[1])
          ];
        } else {
          orderedTyres = rawTyres.map(t => Math.round(t));
        }
      }

      if (rawBrakes && rawBrakes.length >= 4) {
        if (data.brakesTemperature) {
          orderedBrakes = [
            Math.round(rawBrakes[2]),
            Math.round(rawBrakes[3]),
            Math.round(rawBrakes[0]),
            Math.round(rawBrakes[1])
          ];
        } else {
          orderedBrakes = rawBrakes.map(b => Math.round(b));
        }
      }

      updateThermal(orderedTyres, orderedBrakes);
    }

    // THEME & COLOR PICKER
    const THEMES = {
      aston: { accent: '#00E676', glow: 'rgba(0, 230, 118, 0.45)' },
      mercedes: { accent: '#00D2BE', glow: 'rgba(0, 210, 190, 0.45)' },
      ferrari: { accent: '#E10600', glow: 'rgba(225, 6, 0, 0.45)' },
      mclaren: { accent: '#FF8000', glow: 'rgba(255, 128, 0, 0.45)' },
      redbull: { accent: '#FFD100', glow: 'rgba(255, 209, 0, 0.45)' },
      cyberpunk: { accent: '#9B51E0', glow: 'rgba(155, 81, 224, 0.55)' },
    };

    function applyAccentColor(color, glow) {
      document.documentElement.style.setProperty('--accent-color', color);
      document.documentElement.style.setProperty('--accent-glow', glow || `${color}55`);
      document.documentElement.style.setProperty('--halo-rail', color);
      const customCode = document.getElementById('customColorCode');
      if (customCode) customCode.textContent = color.toUpperCase();
      const picker = document.getElementById('customColorPicker');
      if (picker) picker.value = color;
    }

    function selectTheme(team) {
      const cfg = THEMES[team];
      if (cfg) {
        applyAccentColor(cfg.accent, cfg.glow);
        saveRemoteConfig({ accentColor: cfg.accent });
      }
    }

    function setCustomAccent(color) {
      applyAccentColor(color);
      saveRemoteConfig({ accentColor: color });
    }

    function toggleThemeMenu(e) {
      if (e) e.stopPropagation();
      themeMenu.classList.toggle('hidden');
    }

    // REST API Save
    async function saveRemoteConfig(partial) {
      try {
        await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(partial)
        });
      } catch (err) {
        console.warn('Config save offline', err);
      }
    }

    // PYWEBVIEW CONTROLS: Click-through Lock & Centering
    let isLocked = false;
    window.toggleLock = function (e) {
      if (e) e.stopPropagation();
      isLocked = !isLocked;
      document.body.classList.toggle('is-locked', isLocked);

      if (isLocked) {
        lockBtnText.textContent = 'DESTRAVAR';
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.set_clickthrough(true);
        }
      } else {
        lockBtnText.textContent = 'TRAVAR (F8)';
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.set_clickthrough(false);
        }
      }
    };

    window.centerHud = function (e) {
      if (e) e.stopPropagation();
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.center_hud();
      }
    };

    // MOCK SIMULATOR FOR TESTING
    let mockInterval = null;
    let mockAngle = 0;
    function toggleMockSimulator(e) {
      if (e) e.stopPropagation();
      const simBtnText = document.getElementById('simBtnText');
      if (mockInterval) {
        clearInterval(mockInterval);
        mockInterval = null;
        simBtnText.textContent = 'Testar Giro';
      } else {
        simBtnText.textContent = 'Parar Teste';
        mockInterval = setInterval(() => {
          mockAngle += 0.05;
          const sin = Math.sin(mockAngle);
          const rpmNorm = (Math.sin(mockAngle * 2) + 1) / 2;
          const currentGear = Math.min(8, Math.max(1, Math.floor(rpmNorm * 8) + 1));

          renderTelemetry({
            speed: Math.floor(120 + sin * 180),
            gear: currentGear,
            engineRPM: Math.floor(4000 + rpmNorm * 9000),
            maxRPM: 13500,
            throttle: sin > 0 ? sin : 0,
            brake: sin < 0 ? -sin : 0,
            steer: Math.sin(mockAngle * 0.7),
            drs: sin > 0.7 ? 1 : 0,
            drsAllowed: sin > 0.3 ? 1 : 0,
            ersStoreEnergy: Math.floor(2000000 + Math.cos(mockAngle) * 2000000),
            ersDeployMode: sin > 0.5 ? 3 : 1,
            tyresSurfaceTemperature: [
              Math.floor(92 + sin * 16),
              Math.floor(91 + sin * 15),
              Math.floor(88 + sin * 15),
              Math.floor(89 + sin * 14)
            ],
            brakesTemperature: [
              Math.floor(380 + (sin < 0 ? -sin * 350 : 0)),
              Math.floor(385 + (sin < 0 ? -sin * 340 : 0)),
              Math.floor(290 + (sin < 0 ? -sin * 200 : 0)),
              Math.floor(295 + (sin < 0 ? -sin * 190 : 0))
            ]
          });
        }, 33);
      }
    }

    // WEBSOCKET TELEMETRY CLIENT (60Hz) - Resilient to all message formats
    let ws = null;
    function connectWs() {
      const loc = window.location;
      const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = loc.hostname || '127.0.0.1';
      const wsPort = loc.port || '8000';
      const wsUrl = `${wsProto}//${wsHost}:${wsPort}/ws/telemetry`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#00E676]';
        statusLabel.textContent = 'F1 24 CONECTADO (60Hz)';
        statusLabel.className = 'text-emerald-400 uppercase font-bold';
      };

      ws.onmessage = (evt) => {
        try {
          const raw = JSON.parse(evt.data);

          // 1. Config Updates
          if (raw.type === 'config_update') {
            const cfg = raw.config || raw.data || raw;
            if (cfg && cfg.accentColor) applyAccentColor(cfg.accentColor);
            return;
          }
          if (raw.accentColor && raw.speed === undefined) {
            applyAccentColor(raw.accentColor);
            return;
          }

          // 2. Telemetry Updates (accepts wrapped {type: 'telemetry', data: ...} OR direct payload)
          const data = (raw.type === 'telemetry' && raw.data) ? raw.data : raw;
          if (data && (data.speed !== undefined || data.engineRPM !== undefined || data.engine_rpm !== undefined)) {
            renderTelemetry(data);
          }
        } catch (e) {
          console.error("Telemetry parse error", e);
        }
      };

      ws.onclose = () => {
        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse';
        statusLabel.textContent = 'Aguardando F1 24...';
        statusLabel.className = 'text-gray-300 uppercase';
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch (e) { }
      };
    }

    // INITIAL LOAD
    async function loadInitialConfig() {
      try {
        const configUrl = window.location.protocol === 'file:'
          ? 'http://127.0.0.1:8000/api/config'
          : '/api/config';
        const res = await fetch(configUrl);
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.accentColor) {
            applyAccentColor(cfg.accentColor);
          }
        }
      } catch (e) { }
    }

    loadInitialConfig();
    connectWs();
  </script>
</body>
