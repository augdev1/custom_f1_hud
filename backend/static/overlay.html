<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 24 Live Halo HUD Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700;1,800&family=Titillium+Web:ital,wght@0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/halo.css">
  <link rel="stylesheet" href="halo.css">
</head>
<body>
<main id="hudRoot">
<svg id="halo" viewBox="0 0 1200 420" role="img" aria-label="F1 Official Broadcast Halo HUD">
  <defs>
    <!-- Filtro de Glow Néon F1 -->
    <filter id="f1CyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="f1GreenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="rpmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="60%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#FF2A4D"/>
    </linearGradient>
    <linearGradient id="throttleGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#76FF03"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. CORPO UNIFICADO DO HALO HUD (CANOPY)   -->
  <!-- ========================================== -->
  <g id="haloChassis">
    <!-- Fundo de Vidro Fumê Escuro Contínuo -->
    <path class="halo-canopy-bg" d="
      M 535 60
      C 515 60, 480 90, 410 115
      C 320 150, 200 185, 140 250
      C 120 272, 115 310, 155 330
      C 190 345, 230 330, 280 270
      C 350 190, 430 160, 490 150
      C 490 230, 520 275, 600 275
      C 680 275, 710 230, 710 150
      C 770 160, 850 190, 920 270
      C 970 330, 1010 345, 1045 330
      C 1085 310, 1080 272, 1060 250
      C 1000 185, 880 150, 790 115
      C 720 90, 685 60, 665 60
      Z
    "/>

    <!-- Borda Ciano Luminosa Contínua com Chanfros -->
    <path class="halo-border-glow" d="
      M 530 65
      C 505 68, 470 95, 410 120
      C 310 158, 200 195, 145 255
      C 128 275, 130 305, 160 322
      C 190 335, 225 318, 275 265
      C 340 195, 420 168, 485 158
      M 715 158
      C 780 168, 860 195, 925 265
      C 975 318, 1010 335, 1040 322
      C 1070 305, 1072 275, 1055 255
      C 1000 195, 890 158, 790 120
      C 730 95, 695 68, 670 65
    "/>
  </g>

  <!-- ========================================== -->
  <!-- 2. CÚPULA SUPERIOR: DRS BADGE              -->
  <!-- ========================================== -->
  <g id="drsCrest" transform="translate(600 60)">
    <!-- Pill em destaque no topo -->
    <path class="drs-crest-bg" d="M -55 0 L 55 0 C 70 0, 80 -15, 65 -30 C 55 -40, -55 -40, -65 -30 C -80 -15, -70 0, -55 0 Z"/>
    <g id="drsBadge" class="drs-pill">
      <rect x="-48" y="-35" width="96" height="30" rx="15"/>
      <text id="drsText" class="drs-text" x="0" y="-15" text-anchor="middle">DRS</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. POD CENTRAL: VELOCIDADE & TACÔMETRO     -->
  <!-- ========================================== -->
  <g id="centerPod" transform="translate(600 205)">
    <!-- Círculo Central de Vidro -->
    <circle class="pod-inner-disc" cx="0" cy="0" r="74"/>
    
    <!-- Arco Superior de LEDs do Tacômetro (RPM) -->
    <g id="rpmSegments"></g>

    <!-- Rótulo RPM Superior -->
    <text class="rpm-title" x="0" y="-32" text-anchor="middle">RPM</text>
    
    <!-- Velocidade Digital Gigante (264) -->
    <text id="speedVal" class="speed-number" x="0" y="8" text-anchor="middle">264</text>
    
    <!-- Rótulo KM/H Inferior -->
    <text class="unit-title" x="0" y="32" text-anchor="middle">KM/H</text>

    <!-- Velocidade Secundária MPH (Abaixo do Pod) -->
    <text id="mphVal" class="mph-number" x="0" y="55" text-anchor="middle">164 MPH</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. ASA ESQUERDA: DRIVER BATTLE TRACKER    -->
  <!-- ========================================== -->
  <g id="battleTracker" transform="translate(180 180)">
    <!-- Linha 1: Piloto à Frente (11 SAINZ) -->
    <g class="driver-entry p1" transform="translate(0 20)">
      <!-- Escudo / Logo Ferrari -->
      <polygon class="team-shield ferrari" points="0,0 14,0 12,18 7,22 2,18"/>
      <text class="driver-num" x="22" y="15">11</text>
      <text class="driver-name" x="50" y="15">SAINZ</text>
      <!-- Delta Superior -->
      <g class="delta-tag" transform="translate(160 0)">
        <text class="delta-val" x="0" y="15">+0.241s</text>
        <path class="delta-chevron" d="M 52 8 L 57 12 L 52 16" fill="none" stroke="#76FF03" stroke-width="2"/>
      </g>
    </g>

    <!-- Linha Divisória de Intervalo -->
    <path class="battle-divider" d="M 20 48 L 225 48"/>

    <!-- Linha 2: Seu Carro (12 RUSSELL) -->
    <g class="driver-entry p2" transform="translate(30 65)">
      <!-- Logo Mercedes (Círculo com Estrela) -->
      <g class="team-logo merc" transform="translate(6 10)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#00F5D4" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="0" y2="-8" stroke="#00F5D4" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="-7" y2="5" stroke="#00F5D4" stroke-width="1.2"/>
        <line x1="0" y1="0" x2="7" y2="5" stroke="#00F5D4" stroke-width="1.2"/>
      </g>
      <text class="driver-num" x="22" y="15">12</text>
      <text class="driver-name" x="50" y="15">RUSSELL</text>
      
      <!-- Barra Dinâmica de Delta / Intervalo -->
      <g class="delta-tag" transform="translate(155 0)">
        <text id="deltaText" class="delta-val live" x="0" y="15">+0.241s</text>
        <path class="delta-chevron" d="M 52 8 L 57 12 L 52 16" fill="none" stroke="#76FF03" stroke-width="2"/>
      </g>
    </g>

    <!-- Barra de Bateria ERS Integrada na Base da Asa Esquerda -->
    <g class="ers-bracket" transform="translate(50 112)">
      <text class="ers-tag" x="0" y="8">ERS</text>
      <rect class="track" x="28" y="0" width="130" height="9" rx="3"/>
      <rect id="ersBar" class="ers-fill" x="28" y="0" width="100" height="9" rx="3"/>
      <text id="ersPctText" class="ers-pct" x="165" y="8">78%</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 5. ASA DIREITA: TELEMETRIA & MARCHAS      -->
  <!-- ========================================== -->
  <g id="rightTelemetry" transform="translate(690 150)">
    <!-- SEÇÃO SUPERIOR: BARRAS DE THROTTLE E BRAKE -->
    <g class="pedal-bars-group">
      <!-- Barra Curva de Throttle (Segmentos Verdes) -->
      <g id="throttleSegmentsGroup" transform="translate(30 15)">
        <path class="gauge-rail" d="M 0 0 C 60 5, 120 22, 175 48"/>
        <!-- Segmentos de Acelerador gerados dinamicamente via JS -->
        <g id="throttleBars"></g>
        <text id="throttlePctText" class="pedal-val-text" x="185" y="52">100%</text>
        <text class="pedal-title-text throttle" x="235" y="50">THROTTLE</text>
      </g>

      <!-- Barra de Brake (Vermelha) -->
      <g id="brakeSegmentsGroup" transform="translate(45 42)">
        <path class="gauge-rail brake" d="M 0 0 C 50 6, 110 24, 160 48"/>
        <path id="brakeBar" class="brake-line" d="M 0 0 C 0 0, 0 0, 0 0"/>
        <text class="pedal-title-text brake" x="220" y="48">BRAKE</text>
      </g>
    </g>

    <!-- SEÇÃO INFERIOR: RÉGUA DE MARCHAS (N 1 2 3 4 5 6 7 8) -->
    <g id="gearStrip" transform="translate(35 90)">
      <!-- Células de Marchas N 1 2 3 4 5 6 7 8 geradas com curvatura -->
    </g>
  </g>

  <!-- Temperaturas dos Pneus (Opcional - Ativado via Studio) -->
  <g id="tyres" transform="translate(600 375)">
    <text id="tyreText" class="tyre-readout" text-anchor="middle">FL 100°   FR 100°   RL 100°   RR 100°</text>
  </g>
</svg>

<nav id="controls" class="pywebview-drag-region" aria-label="Controles da HUD">
  <span>F1 24 OFFICIAL HALO HUD</span>
  <button id="lockButton">Travar · F8</button>
  <button id="centerButton">Centralizar</button>
  <button id="closeButton" aria-label="Fechar HUD">×</button>
</nav>

<div id="connection" role="status">CONECTANDO AO BACKEND</div>
</main>

<script type="module" src="/static/halo.js"></script>
<script type="module" src="halo.js"></script>
</body>
</html>
