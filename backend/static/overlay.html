<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 24 Live Halo HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700;1,800&family=Titillium+Web:ital,wght@0,600;0,700;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/halo.css">
  <link rel="stylesheet" href="halo.css">
</head>
<body>
<main id="hudRoot">
<svg id="halo" viewBox="-45 -10 1090 260" role="img" aria-label="F1 TV Broadcast Halo HUD Telemetry">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="throttleGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2BE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="brakeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C5182D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF2A4D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ersGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
  </defs>

  <!-- Contorno contínuo do Halo de fibra de carbono -->
  <path class="halo-outline" d="M30 190 Q260 50 500 50 Q740 50 970 190 M46 228 Q270 95 500 95 Q730 95 954 228"/>

  <!-- ASA ESQUERDA: Battle Tracker & Bateria ERS -->
  <g id="battlePanel" transform="translate(85 142) rotate(-19)">
    <path class="panel" d="M0 6 Q110 -6 225 0 L225 60 Q110 54 0 66 Z"/>
    
    <!-- Driver Battle / Intervalo -->
    <g class="driver-row" transform="translate(12 8)">
      <rect class="driver-accent p1" x="0" y="2" width="3" height="15" rx="1"/>
      <text class="driver-num" x="8" y="14">11</text>
      <text class="driver-name" x="32" y="14">SAINZ</text>
      <text class="driver-gap" x="204" y="14" text-anchor="end">INTERVAL</text>
    </g>
    <g class="driver-row" transform="translate(12 28)">
      <rect class="driver-accent p2" x="0" y="2" width="3" height="15" rx="1"/>
      <text class="driver-num" x="8" y="14">12</text>
      <text class="driver-name" x="32" y="14">RUSSELL</text>
      <text id="deltaText" class="driver-delta" x="204" y="14" text-anchor="end">+0.428s</text>
    </g>

    <!-- Barra de Bateria ERS Integrada -->
    <g class="ers-row" transform="translate(12 48)">
      <text class="ers-label" x="0" y="9">ERS</text>
      <rect class="track" x="30" y="2" width="138" height="7" rx="2"/>
      <rect id="ersBar" class="ers" x="30" y="2" width="0" height="7" rx="2"/>
      <text id="ersPctText" class="ers-pct" x="204" y="9" text-anchor="end">—%</text>
    </g>
  </g>

  <!-- MEDIDOR DE FREIO (Barra Vertical Esquerda Curvada) -->
  <g id="brakePanel" transform="translate(412 55) rotate(-6)">
    <path class="panel pedal-pod" d="M-6 0 L22 0 L22 92 L-6 92 Z"/>
    <text class="pedal-label" x="8" y="8" text-anchor="middle">BRAKE</text>
    <rect class="pedal-track" x="1" y="12" width="14" height="74" rx="2"/>
    <rect id="brakeBar" class="brake" x="1" y="86" width="14" height="0" rx="2"/>
  </g>

  <!-- POD CENTRAL: Velocidade, Arco de RPM e DRS Central -->
  <g id="speedPod" transform="translate(500 102)">
    <!-- Corpo Central do Pod em Vidro Fumê -->
    <circle class="panel pod-body" cx="0" cy="0" r="69"/>
    
    <!-- Arco Superior de LEDs do Tacômetro (RPM) -->
    <g id="rpmSegments"></g>
    
    <!-- Velocidade Digital Primária (KM/H) -->
    <text class="pod-unit" x="0" y="-38" text-anchor="middle">KM/H</text>
    <text id="speedVal" class="speed" x="0" y="-8" text-anchor="middle">—</text>
    
    <!-- Badge Central de DRS -->
    <g id="drsBadge" class="drs-pill" transform="translate(-32 6)">
      <rect width="64" height="20" rx="4"/>
      <text id="drsText" class="drs-label" x="32" y="14" text-anchor="middle">DRS</text>
    </g>
    
    <!-- Velocidade Secundária (MPH) -->
    <text id="mphVal" class="sub-speed" x="0" y="44" text-anchor="middle">— MPH</text>
  </g>

  <!-- MEDIDOR DE ACELERADOR (Barra Vertical Direita Curvada) -->
  <g id="throttlePanel" transform="translate(574 55) rotate(6)">
    <path class="panel pedal-pod" d="M-6 0 L22 0 L22 92 L-6 92 Z"/>
    <text class="pedal-label" x="8" y="8" text-anchor="middle">THROTTLE</text>
    <rect class="pedal-track" x="1" y="12" width="14" height="74" rx="2"/>
    <rect id="throttleBar" class="throttle" x="1" y="86" width="14" height="0" rx="2"/>
  </g>

  <!-- ASA DIREITA: Régua de Marchas & Escala de RPM -->
  <g id="gearsPanel" transform="translate(685 75) rotate(16)">
    <path class="panel" d="M0 0 Q110 0 226 8 L222 66 Q110 58 0 58 Z"/>
    
    <!-- Régua de Marchas N 1 2 3 4 5 6 7 8 -->
    <g id="gearStrip" transform="translate(14 12) scale(0.92)"></g>
    
    <!-- Escala de RPM -->
    <text class="rpm-label" x="14" y="52">RPM ×1000</text>
    <text id="rpmNumText" class="rpm-live" x="110" y="52">— RPM</text>
    <text class="rpm-ticks" x="214" y="52" text-anchor="end">4  6  8  10  12  14</text>
    <path class="rail" d="M14 43 H214"/>
  </g>

  <!-- BADGE FLUTUANTE DE RÁDIO (Estilo F1 Broadcast) -->
  <g id="radioBadge" transform="translate(860 48)">
    <rect class="radio-bg" width="105" height="32" rx="4"/>
    <rect class="radio-bar" x="0" y="0" width="3" height="32" rx="1"/>
    <text class="radio-title" x="14" y="14">RUSSELL</text>
    <text class="radio-sub" x="14" y="26">RADIO</text>
    <!-- Ícone de onda de rádio / soundwave -->
    <g class="radio-wave" transform="translate(84 10)">
      <line x1="0" y1="6" x2="0" y2="10"/>
      <line x1="4" y1="3" x2="4" y2="13"/>
      <line x1="8" y1="0" x2="8" y2="16"/>
      <line x1="12" y1="4" x2="12" y2="12"/>
    </g>
  </g>

  <!-- Temperaturas dos Pneus (Opcional) -->
  <g id="tyres" transform="translate(500 205)">
    <text id="tyreText" class="tyres-text" text-anchor="middle">FL —  FR —  RL —  RR —</text>
  </g>
</svg>

<nav id="controls" class="pywebview-drag-region" aria-label="Controles da HUD">
  <span>F1 HALO BROADCAST HUD</span>
  <button id="lockButton">Travar · F8</button>
  <button id="centerButton">Centralizar</button>
  <button id="closeButton" aria-label="Fechar HUD">×</button>
</nav>

<div id="connection" role="status">CONECTANDO AO BACKEND</div>
</main>
<script type="module" src="/static/halo.js"></script>
<script type="module" src="halo.js"></script>
</body>
</html>
